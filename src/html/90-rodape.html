</script>

<!-- ESTADO LOCAL DURÁVEL: RAM síncrona + IndexedDB por registro.
     PostgreSQL continua sendo a fonte canônica online; o IndexedDB é cache
     offline + outbox. Cards não voltam a um blob gigante: cada card é uma
     linha local e só é serializado quando algum fluxo realmente pede JSON. -->
<script>
(function () {
  'use strict';

  var nativeLS = null;
  try { nativeLS = window.localStorage; } catch (_) { nativeLS = null; }
  var mem = new Map();
  var cardsMem = new Map();      // storageKey -> Array<card>
  var cardKeys = new Set();
  var keysCache = null;
  var THEME = 'diario-estudos:theme';
  var IDB_NAME = 'diario-estudos-local-v3';
  var IDB_VERSION = 1;
  var pendingWrites = new Set();
  var dirtyTokens = new Map();
  var dirtySeq = 0;
  var idb = null;

  function nextDirtyToken(id) {
    var t = Date.now().toString(36) + '-' + (++dirtySeq).toString(36) + '-' + Math.random().toString(36).slice(2,8);
    dirtyTokens.set(String(id), t);
    return t;
  }

  function invalidate() { keysCache = null; }
  function isStudyKey(k) { return String(k || '').indexOf('diario-estudos:') === 0; }
  function isMemoryKey(k) { return isStudyKey(k) && k !== THEME; }
  function isCardsKey(k) { return /^diario-estudos:u:[^:]+:p:[^:]+:cards$/.test(String(k || '')); }
  function isTransientKey(k) {
    var s = String(k || '');
    return /:(?:revlog|revlog-pendente|revlog-arquivo(?:[:].*)?|__trash:.*)$/.test(s)
      || s === 'diario-estudos:profiles' || s === 'diario-estudos:active-profile';
  }
  function applyingRemote() {
    try {
      return !!((window.RelationalStore && RelationalStore._applying)
        || (window.CloudStore && CloudStore._applying));
    } catch (_) { return false; }
  }
  function dirtyAllowed(k) { return isMemoryKey(k) && !isTransientKey(k) && !applyingRemote(); }
  function currentUserId() {
    try { return window.CloudStore && CloudStore.session && CloudStore.session.user ? String(CloudStore.session.user.id || '') : ''; }
    catch (_) { return ''; }
  }

  function openIDB() {
    if (!window.indexedDB) return Promise.resolve(null);
    return new Promise(function (resolve) {
      var req;
      try { req = indexedDB.open(IDB_NAME, IDB_VERSION); } catch (_) { resolve(null); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('cards')) {
          var cs = db.createObjectStore('cards', { keyPath: 'pk' });
          cs.createIndex('by_storage_key', 'storageKey', { unique: false });
        }
        if (!db.objectStoreNames.contains('dirty')) {
          var ds = db.createObjectStore('dirty', { keyPath: 'id' });
          ds.createIndex('by_key', 'key', { unique: false });
        }
      };
      req.onsuccess = function () {
        idb = req.result;
        idb.onversionchange = function () { try { idb.close(); } catch (_) {} };
        resolve(idb);
      };
      req.onerror = function () { resolve(null); };
      req.onblocked = function () { resolve(null); };
    });
  }

  function reqP(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('IndexedDB')); };
    });
  }
  function txDone(tx) {
    return new Promise(function (resolve, reject) {
      tx.oncomplete = function () { resolve(); };
      tx.onabort = tx.onerror = function () { reject(tx.error || new Error('IndexedDB transaction')); };
    });
  }
  function track(p) {
    p = Promise.resolve(p).catch(function (e) {
      try { console.error('[local-durable]', e); } catch (_) {}
      throw e;
    });
    pendingWrites.add(p);
    p.then(function () { pendingWrites.delete(p); }, function () { pendingWrites.delete(p); });
    return p;
  }
  function flushLocal() {
    return Promise.all(Array.from(pendingWrites)).then(function () { return true; });
  }

  function putDirty(rec) {
    if (!idb || !rec || !rec.id) return Promise.resolve();
    var tx = idb.transaction('dirty', 'readwrite');
    tx.objectStore('dirty').put(rec);
    return txDone(tx);
  }
  function delDirty(id) {
    if (!idb || !id) return Promise.resolve();
    var tx = idb.transaction('dirty', 'readwrite');
    tx.objectStore('dirty').delete(id);
    return txDone(tx);
  }
  function markKvDirty(k, v) {
    if (!dirtyAllowed(k)) return Promise.resolve();
    var id='kv|' + k, token=nextDirtyToken(id);
    return putDirty({ id, token, kind:'kv', key:k, value:v == null ? null : String(v), userId:currentUserId(), at:Date.now() });
  }

  async function persistKV(k, v, markDirty, oldValue) {
    if (!idb) return;
    var tx = idb.transaction(['kv','dirty'], 'readwrite');
    var st = tx.objectStore('kv');
    if (v == null) st.delete(k); else st.put({ key: k, value: String(v) });
    if (markDirty && dirtyAllowed(k)) {
      var ds=tx.objectStore('dirty'), id='kv|' + k, token=nextDirtyToken(id);
      var anterior=null;
      try { anterior=await reqP(ds.get(id)); } catch (_) {}
      ds.put({
        id, token, kind:'kv', key:k,
        /* A PRIMEIRA versão anterior é a base remota presumida. Se o usuário
           editar dez vezes offline, ela não é substituída pela nona edição. */
        oldValue:anterior && Object.prototype.hasOwnProperty.call(anterior,'oldValue')
          ? anterior.oldValue : (oldValue == null ? null : String(oldValue)),
        value:v == null ? null : String(v),
        userId:currentUserId(), at:Date.now()
      });
    }
    await txDone(tx);
  }

  function deleteCardsForKeyInTx(tx, key) {
    return new Promise(function (resolve, reject) {
      var idx = tx.objectStore('cards').index('by_storage_key');
      var req = idx.openCursor(IDBKeyRange.only(key));
      req.onsuccess = function () {
        var cur = req.result;
        if (!cur) { resolve(); return; }
        cur.delete(); cur.continue();
      };
      req.onerror = function () { reject(req.error || new Error('cards cursor')); };
    });
  }
  function clearDirtyForKeyInTx(tx, key) {
    return new Promise(function (resolve, reject) {
      var idx = tx.objectStore('dirty').index('by_key');
      var req = idx.openCursor(IDBKeyRange.only(key));
      req.onsuccess = function () {
        var cur = req.result;
        if (!cur) { resolve(); return; }
        var v = cur.value || {};
        if (v.kind === 'card' || v.kind === 'cards-replace') cur.delete();
        cur.continue();
      };
      req.onerror = function () { reject(req.error || new Error('dirty cursor')); };
    });
  }
  function cardPk(key, id) { return key + '\u0000' + String(id); }

  function clearCardsKey(key, opts) {
    opts = opts || {};
    cardsMem.delete(key); cardKeys.delete(key); invalidate();
    if (!idb) return Promise.resolve(true);
    var p = (async function () {
      var tx = idb.transaction(['cards','dirty','kv'], 'readwrite');
      await deleteCardsForKeyInTx(tx, key);
      await clearDirtyForKeyInTx(tx, key);
      tx.objectStore('kv').delete(key);
      if (opts.dirty !== false && !applyingRemote()) {
        var id='cards-replace|' + key, token=nextDirtyToken(id);
        tx.objectStore('dirty').put({
          id, token, kind:'cards-replace', key:key,
          userId:currentUserId(), at:Date.now()
        });
      }
      await txDone(tx);
      return true;
    })();
    return track(p);
  }

  function replaceCards(key, list, opts) {
    opts = opts || {};
    list = Array.isArray(list) ? list : [];
    cardsMem.set(key, list); cardKeys.add(key); invalidate();
    if (!idb) return Promise.resolve(true);
    var p = (async function () {
      var tx = idb.transaction(['cards','dirty','kv'], 'readwrite');
      await deleteCardsForKeyInTx(tx, key);
      await clearDirtyForKeyInTx(tx, key);
      var st = tx.objectStore('cards');
      list.forEach(function (card, i) {
        if (!card || card.id == null) return;
        st.put({ pk:cardPk(key,card.id), storageKey:key, cardId:String(card.id), position:i, card:card });
      });
      tx.objectStore('kv').delete(key); // cards nunca viram blob persistente
      if (opts.dirty !== false && !applyingRemote()) {
        var id='cards-replace|' + key, token=nextDirtyToken(id);
        tx.objectStore('dirty').put({ id, token, kind:'cards-replace', key:key, userId:currentUserId(), at:Date.now() });
      }
      await txDone(tx);
      return true;
    })();
    return track(p);
  }

  function upsertCard(key, card, position, opts) {
    opts = opts || {};
    if (!card || card.id == null) return Promise.resolve(false);
    if (!cardsMem.has(key)) cardsMem.set(key, []);
    cardKeys.add(key); invalidate();
    if (!idb) return Promise.resolve(true);
    var p = (async function () {
      var tx = idb.transaction(['cards','dirty'], 'readwrite');
      tx.objectStore('cards').put({
        pk:cardPk(key,card.id), storageKey:key, cardId:String(card.id),
        position:Number.isFinite(position) ? position : 0, card:card
      });
      if (opts.dirty !== false && !applyingRemote()) {
        var id='card|' + key + '|' + String(card.id), token=nextDirtyToken(id);
        tx.objectStore('dirty').put({
          id, token, kind:'card', key:key,
          cardId:String(card.id), value:card, userId:currentUserId(), at:Date.now()
        });
      }
      await txDone(tx);
      return true;
    })();
    return track(p);
  }

  function deleteCard(key, cardId, opts) {
    opts = opts || {};
    if (!idb) return Promise.resolve(true);
    var p = (async function () {
      var tx = idb.transaction(['cards','dirty'], 'readwrite');
      tx.objectStore('cards').delete(cardPk(key, cardId));
      if (opts.dirty !== false && !applyingRemote()) {
        var id='card|' + key + '|' + String(cardId), token=nextDirtyToken(id);
        tx.objectStore('dirty').put({
          id, token, kind:'card', key:key,
          cardId:String(cardId), value:null, userId:currentUserId(), at:Date.now()
        });
      }
      await txDone(tx);
      return true;
    })();
    return track(p);
  }

  function markReview(key, row, kind) {
    if (!idb || !row) return Promise.resolve();
    var rid = row.reviewId || (String(row.cardId) + '|' + String(row.ts) + '|' + String(row._position || ''));
    var k = kind === 'review-delete' ? 'review-delete' : 'review';
    var id=k+'|' + key + '|' + rid, token=nextDirtyToken(id);
    return track(putDirty({ id, token, kind:k, key:key, reviewId:rid, value:row, userId:currentUserId(), at:Date.now() }));
  }
  function markRevlogReplace(key) {
    if (!idb) return Promise.resolve();
    var id='revlog-replace|' + key, token=nextDirtyToken(id);
    return track(putDirty({ id, token, kind:'revlog-replace', key:key, userId:currentUserId(), at:Date.now() }));
  }

  function loadAll() {
    return openIDB().then(async function (db) {
      if (!db) return;
      try {
        var tx1 = db.transaction('kv', 'readonly');
        var rows = await reqP(tx1.objectStore('kv').getAll());
        rows.forEach(function (r) { if (r && r.key != null) mem.set(String(r.key), String(r.value)); });
        await txDone(tx1);
      } catch (_) {}
      try {
        var tx2 = db.transaction('cards', 'readonly');
        var rows2 = await reqP(tx2.objectStore('cards').getAll());
        var groups = new Map();
        rows2.forEach(function (r) {
          if (!r || !r.storageKey) return;
          var a = groups.get(r.storageKey); if (!a) { a=[]; groups.set(r.storageKey,a); }
          a.push(r);
        });
        groups.forEach(function (rows3, key) {
          rows3.sort(function (a,b) { return (a.position||0)-(b.position||0); });
          cardsMem.set(key, rows3.map(function (r) { return r.card; }));
          cardKeys.add(key);
        });
      } catch (_) {}
      invalidate();
    });
  }
  var localReady = loadAll();

  function notify(k, oldV, newV) {
    try {
      if (window.RelationalStore && RelationalStore.onStorageMutation) {
        RelationalStore.onStorageMutation(k, oldV, newV);
      }
    } catch (e) { try { console.error('[local-durable] persist hook', e); } catch (_) {} }
  }

  var LS = {
    getItem: function (k) {
      k = String(k);
      if (isCardsKey(k) && cardsMem.has(k)) {
        try { return JSON.stringify(cardsMem.get(k)); } catch (_) { return '[]'; }
      }
      if (isMemoryKey(k)) return mem.has(k) ? mem.get(k) : null;
      try { return nativeLS ? nativeLS.getItem(k) : null; } catch (_) { return null; }
    },
    setItem: function (k, v) {
      k = String(k); v = String(v);
      if (isMemoryKey(k)) {
        if (isCardsKey(k)) {
          var oldCards = cardsMem.get(k) || [];
          var oldV = applyingRemote() ? null : JSON.stringify(oldCards);
          var parsed = [];
          try { parsed = JSON.parse(v); if (!Array.isArray(parsed)) parsed=[]; } catch (_) {}
          replaceCards(k, parsed, { dirty: !applyingRemote() });
          if (oldV !== v) notify(k, oldV, v);
          return;
        }
        var old = mem.has(k) ? mem.get(k) : null;
        if (!mem.has(k)) invalidate();
        mem.set(k, v);
        track(persistKV(k, v, !applyingRemote(), old));
        if (old !== v) notify(k, old, v);
        return;
      }
      var oldNative = null;
      try {
        if (nativeLS) { oldNative = nativeLS.getItem(k); nativeLS.setItem(k, v); }
      } catch (_) {}
      if (isStudyKey(k) && oldNative !== v) notify(k, oldNative, v);
    },
    removeItem: function (k) {
      k = String(k);
      if (isMemoryKey(k)) {
        if (isCardsKey(k)) {
          var oldCards = cardsMem.get(k) || [];
          var oldRaw = applyingRemote() ? null : JSON.stringify(oldCards);
          clearCardsKey(k, { dirty: !applyingRemote() });
          if (oldRaw != null) notify(k, oldRaw, null);
          return;
        }
        var oldV = mem.has(k) ? mem.get(k) : null;
        if (mem.delete(k)) invalidate();
        track(persistKV(k, null, !applyingRemote(), oldV));
        if (oldV != null) notify(k, oldV, null);
        return;
      }
      var oldNative = null;
      try { if (nativeLS) { oldNative = nativeLS.getItem(k); nativeLS.removeItem(k); } } catch (_) {}
      if (isStudyKey(k) && oldNative != null) notify(k, oldNative, null);
    },
    clear: function () {
      /* Remove através do MESMO caminho durável; limpar os Maps antes fazia
         removeItem achar "nada" e deixava chaves órfãs no IndexedDB. */
      var memKeys = Array.from(mem.keys());
      var cardKeysNow = Array.from(cardKeys);
      memKeys.forEach(function (k) { LS.removeItem(k); });
      cardKeysNow.forEach(function (k) { LS.removeItem(k); });
      try { if (nativeLS) nativeLS.clear(); } catch (_) {}
      invalidate();
    },
    key: function (i) {
      i = i >> 0;
      if (!keysCache) {
        var a = Array.from(mem.keys());
        cardKeys.forEach(function (k) { if (a.indexOf(k)<0) a.push(k); });
        try {
          if (nativeLS) for (var j = 0; j < nativeLS.length; j++) {
            var nk = nativeLS.key(j);
            if (nk != null && !isMemoryKey(nk) && a.indexOf(nk) < 0) a.push(nk);
          }
        } catch (_) {}
        keysCache = a;
      }
      return (i >= 0 && i < keysCache.length) ? keysCache[i] : null;
    }
  };
  Object.defineProperty(LS, 'length', { get: function () {
    if (!keysCache) LS.key(-1);
    return keysCache ? keysCache.length : 0;
  }});

  try {
    Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return LS; } });
  } catch (e) {
    try { window.localStorage = LS; } catch (_) {}
  }

  window.__nativeLS = nativeLS;
  window.__memoryOnlyStore = false;
  window.__idbShim = true;
  window.LocalDurable = {
    ready: localReady,
    flush: flushLocal,
    pendingCount: function () { return pendingWrites.size; },
    listDirty: function (userId) {
      if (!idb) return Promise.resolve([]);
      var tx=idb.transaction('dirty','readonly');
      return reqP(tx.objectStore('dirty').getAll()).then(function (rows) {
        rows=rows||[];
        var uid=String(userId || currentUserId() || '');
        /* Registros antigos sem userId são aceitos apenas quando o profile_id
           da chave pertence à sessão atual; o RLS continua sendo a barreira final. */
        return rows.filter(function (r) { return !r.userId || !uid || String(r.userId)===uid; });
      });
    },
    tokenFor: function (id) { return dirtyTokens.get(String(id)) || null; },
    markSynced: function (id, token) {
      if (!idb || !id) return Promise.resolve(false);
      var p=(async function () {
        var tx=idb.transaction('dirty','readwrite'), st=tx.objectStore('dirty');
        var row=null; try { row=await reqP(st.get(id)); } catch (_) {}
        var same=!row || !token || !row.token || row.token===token;
        if (row && same) st.delete(id);
        await txDone(tx);
        if (same && (!token || dirtyTokens.get(String(id))===token)) dirtyTokens.delete(String(id));
        return same;
      })();
      return track(p);
    },
    markReview: function (key,row) { return markReview(key,row,'review'); },
    markReviewDelete: function (key,row) { return markReview(key,row,'review-delete'); },
    markRevlogReplace: markRevlogReplace,
    getCards: function (key) { return cardsMem.get(key) || null; },
    replaceCards: replaceCards,
    upsertCard: upsertCard,
    deleteCard: deleteCard,
    clearCardsKey: clearCardsKey
  };
  window.__idbPendingCount = function () { return pendingWrites.size; };
  window.__idbFlush = flushLocal;
  window.__idbFlushStrict = function () {
    return flushLocal().then(function () { return {ok:true, relational:false, pending:pendingWrites.size}; });
  };

  /* Remove só o namespace de estudo do localStorage NATIVO. A cópia offline
     vive no IndexedDB novo; auth do Supabase e tema continuam intactos. */
  setTimeout(function () {
    if (!nativeLS) return;
    try {
      var apagar = [];
      for (var i = 0; i < nativeLS.length; i++) {
        var k = nativeLS.key(i);
        if (k && isStudyKey(k) && k !== THEME) apagar.push(k);
      }
      apagar.forEach(function (k) { try { nativeLS.removeItem(k); } catch (_) {} });
    } catch (_) {}
  }, 5000);

  function applyTheme() {
    try {
      var saved = nativeLS && nativeLS.getItem(THEME);
      if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved);
    } catch (_) {}
  }
  applyTheme();

  var domReady = new Promise(function (resolve) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', resolve, { once: true });
    else resolve();
  });

  function runApp() {
    var codeEl = document.getElementById('app-code');
    if (!codeEl) return;
    var s = document.createElement('script');
    s.textContent = codeEl.textContent;
    document.body.appendChild(s);
    try {
      var ov = document.getElementById('app-loading');
      if (ov) { ov.classList.add('hide'); setTimeout(function () { if (ov.parentNode) ov.parentNode.removeChild(ov); }, 320); }
    } catch (_) {}
  }

  function existe(url, tipo) {
    return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      if (!r || !r.ok) return false;
      return (r.headers.get('content-type') || '').toLowerCase().indexOf(tipo) >= 0;
    }).catch(function () { return false; });
  }
  function registrarSW() {
    try {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      existe('manifest.webmanifest', 'json').then(function (ok) {
        if (ok) {
          var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
        }
      });
      existe('sw.js', 'javascript').then(function (ok) {
        if (!ok) return;
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
          function avisar() { try { if (window.__avisarAtualizacao) window.__avisarAtualizacao(reg); } catch (_) {} }
          reg.addEventListener('updatefound', function () {
            var novo = reg.installing; if (!novo) return;
            novo.addEventListener('statechange', function () {
              if (novo.state === 'installed' && navigator.serviceWorker.controller) avisar();
            });
          });
          if (reg.waiting && navigator.serviceWorker.controller) avisar();
          var check = function () { try { reg.update(); } catch (_) {} };
          document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
          setInterval(check, 1800000);
        }).catch(function () {});
      });
    } catch (_) {}
  }

  window.__repararCache = function () {
    var jobs = [];
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (_) {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      }
    } catch (_) {}
    return Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  };

  Promise.all([domReady, localReady.catch(function(){})]).then(runApp).then(function () { setTimeout(registrarSW, 1200); });
})();
</script>
