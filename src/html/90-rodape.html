</script>

<!-- ============================================================
     CAMADA DE PERSISTÊNCIA: IndexedDB
     ------------------------------------------------------------
     O app inteiro foi escrito sobre a API SÍNCRONA do localStorage
     (getItem/setItem/removeItem/key/length), que tem cota de ~5 MB.
     Em vez de reescrever as ~80 chamadas para a API assíncrona do
     IndexedDB, instalamos aqui uma FACHADA compatível:

       1) Ao carregar, todos os pares chave/valor são lidos do
          IndexedDB para um cache em memória (hidratação).
       2) window.localStorage é substituído por uma implementação
          que lê do cache (síncrono) e grava no IndexedDB de forma
          assíncrona (write-through), sem bloquear a interface.
       3) Só então o código do app (script inerte "app-code") é
          executado — passando a usar o IndexedDB de forma transparente.

     Ganho: a cota deixa de ser ~5 MB e passa a ser a do IndexedDB
     (centenas de MB), eliminando os avisos de "armazenamento cheio".
     ============================================================ -->
<script>
(function () {
  'use strict';

  var IDB_NAME = 'diario-estudos-db', IDB_STORE = 'kv', IDB_VERSION = 1;
  var MIRROR_MAX = 100000; // espelha no localStorage nativo só chaves pequenas (evita cota)

  var nativeLS = null;
  try { nativeLS = window.localStorage; } catch (e) { nativeLS = null; }

  var cache = new Map();   // fonte da verdade em memória (síncrona)
  var _keys = null;        // cache do Array de chaves p/ .key(i)
  function invalidateKeys() { _keys = null; }

  var db = null, queue = [], flushing = false;

  function openIDB() {
    /* Reaproveita a abertura disparada no <head> (roda em paralelo com o parse).
       Só abre de novo se aquela não existir ou tiver falhado — assim o caminho
       de erro continua idêntico ao de antes. */
    if (window.__idbBoot && typeof window.__idbBoot.then === 'function') {
      return window.__idbBoot.catch(function () { return abrirDireto(); });
    }
    return abrirDireto();
  }
  function abrirDireto() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open(IDB_NAME, IDB_VERSION); }
      catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        try {
          var d = req.result;
          if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
        } catch (e) { _quiet(e); }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  // ---- write-through assíncrono (lote por microtask) ----
  /* Quem está esperando o DISCO confirmar. `setItem` volta na hora (cache em
     memória), mas a gravação real no IndexedDB acontece depois. Recarregar a
     página nesse intervalo ABORTA a transação — e era assim que a sessão
     recém-gravada do login às vezes não estava lá na abertura seguinte.
     window.__idbFlush() permite ao app esperar a confirmação antes de recarregar. */
  var esperandoDisco = [];
  function avisarDisco() {
    var lista = esperandoDisco; esperandoDisco = [];
    for (var i = 0; i < lista.length; i++) { try { lista[i](); } catch (e) {} }
  }
  window.__idbFlush = function () {
    if (!db || (!queue.length && !flushing)) return Promise.resolve();
    return new Promise(function (resolve) {
      esperandoDisco.push(resolve);
      scheduleFlush();
      setTimeout(resolve, 2000);   // teto: nunca travar a interface esperando o disco
    });
  };
  // App indo para segundo plano/fechando: garante a descarga do que está na fila.
  try {
    window.addEventListener('pagehide', function () { try { window.__idbFlush(); } catch (e) {} });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { try { window.__idbFlush(); } catch (e) {} }
    });
  } catch (e) {}

  function scheduleFlush() { if (!flushing) { flushing = true; Promise.resolve().then(flush); } }

  /* ── QUANDO O DISCO RECUSA ────────────────────────────────────────────────
     A gravação sai da fila ANTES de a transação terminar. Se ela falhava
     (cota estourada, disco cheio, a conexão fechada por um `versionchange`), o
     lote simplesmente sumia: o cache em memória continuava mostrando o valor, a
     tela continuava mostrando o valor, e ele só deixava de existir na abertura
     seguinte — sem um único erro no caminho. Este é o modo de perda mais
     traiçoeiro que existe, porque nada parece errado até ser tarde.

     Agora o lote VOLTA para a fila e é retentado com espera crescente. A ordem
     é preservada: as operações que falharam entram na frente das que chegaram
     depois, então uma gravação mais nova para a mesma chave continua vencendo.
     Esgotadas as tentativas, o app é avisado — porque insistir em silêncio é o
     que fazia o dado sumir sem ninguém saber. */
  var falhasSeguidas = 0;
  var ESPERA_RETENTAR = [400, 2000, 8000];
  function devolverAFila(ops) {
    if (ops && ops.length) queue = ops.concat(queue);
    flushing = false;
    var tentativa = falhasSeguidas++;
    if (tentativa < ESPERA_RETENTAR.length) {
      // ainda vamos tentar: quem espera o disco continua esperando (com o teto
      // de 2 s do __idbFlush, que já impede a interface de ficar presa)
      setTimeout(scheduleFlush, ESPERA_RETENTAR[tentativa]);
      return;
    }
    /* Desistimos de retentar sozinhos, mas NÃO jogamos a fila fora: qualquer
       gravação seguinte dispara uma nova rodada, e se o disco voltar o que está
       aqui ainda entra. Descartar seria repetir, de propósito, exatamente a
       perda que este bloco existe para impedir. */
    falhasSeguidas = 0;
    try { if (typeof window.__idbFalhouAoGravar === 'function') window.__idbFalhouAoGravar(queue.length); }
    catch (e) { _quiet(e); }
    avisarDisco();
  }

  function flush() {
    if (!db) { flushing = false; avisarDisco(); return; }
    var ops = queue; queue = [];
    if (!ops.length) { flushing = false; avisarDisco(); return; }
    var tx, store;
    try { tx = db.transaction(IDB_STORE, 'readwrite'); store = tx.objectStore(IDB_STORE); }
    catch (e) { _quiet(e); devolverAFila(ops); return; }
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      try {
        if (op.t === 'set') store.put(op.v, op.k);
        else if (op.t === 'del') store.delete(op.k);
        else if (op.t === 'clear') store.clear();
      } catch (e) { _quiet(e); }
    }
    tx.oncomplete = function () {
      flushing = false; falhasSeguidas = 0;
      if (queue.length) scheduleFlush(); else avisarDisco();
    };
    tx.onerror = function () { devolverAFila(ops); };
    tx.onabort = function () { devolverAFila(ops); };
  }
  function enqueue(op) { queue.push(op); scheduleFlush(); }

  // Espelho best-effort no localStorage nativo: mantém chaves pequenas (ex.: tema)
  // acessíveis ao script que evita o "flash" de tela clara. Erros de cota são ignorados.
  function mirrorNative(t, k, v) {
    if (!nativeLS) return;
    try {
      if (t === 'set') { if (v.length < MIRROR_MAX) nativeLS.setItem(k, v); else nativeLS.removeItem(k); }
      else if (t === 'del') nativeLS.removeItem(k);
    } catch (e) { _quiet(e); }
  }

  // ---- fachada compatível com a Storage API ----
  var LS = {
    getItem: function (k) { k = String(k); return cache.has(k) ? cache.get(k) : null; },
    setItem: function (k, v) {
      k = String(k); v = String(v);
      if (!cache.has(k)) invalidateKeys();
      cache.set(k, v);
      enqueue({ t: 'set', k: k, v: v });
      mirrorNative('set', k, v);
    },
    removeItem: function (k) {
      k = String(k);
      if (cache.has(k)) { cache.delete(k); invalidateKeys(); }
      enqueue({ t: 'del', k: k });
      mirrorNative('del', k);
    },
    clear: function () {
      cache.clear(); invalidateKeys();
      enqueue({ t: 'clear' });
      try { if (nativeLS) nativeLS.clear(); } catch (e) { _quiet(e); }
    },
    key: function (i) {
      i = i >> 0;
      if (!_keys) _keys = Array.from(cache.keys());
      return (i >= 0 && i < _keys.length) ? _keys[i] : null;
    }
  };
  Object.defineProperty(LS, 'length', { get: function () { return cache.size; } });

  function installShim() {
    // __idbShim informa ao app se ele está rodando sobre o IndexedDB (cota grande)
    // ou caiu para o localStorage nativo (~5 MB). O aviso antecipado de espaço usa
    // isso para não gritar "quase cheio" com 4 MB quando há centenas de MB livres.
    try {
      Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return LS; } });
      window.__idbShim = true;
      return true;
    } catch (e) {
      try { window.localStorage = LS; window.__idbShim = true; return true; }
      catch (e2) { window.__idbShim = false; return false; }
    }
  }

  function hydrate() {
    return new Promise(function (resolve) {
      if (!db) { resolve(); return; }
      var tx, store, req;
      try { tx = db.transaction(IDB_STORE, 'readonly'); store = tx.objectStore(IDB_STORE); req = store.openCursor(); }
      catch (e) { resolve(); return; }
      req.onsuccess = function () {
        var cur = req.result;
        if (cur) { cache.set(String(cur.key), String(cur.value)); cur.continue(); }
        else { invalidateKeys(); resolve(); }
      };
      req.onerror = function () { resolve(); };
    });
  }

  /* ── ADOÇÃO DO ARMAZENAMENTO ANTIGO ──────────────────────────────────────
     Esta função era tudo-ou-nada: `if (cache.size > 0) return`. Ou seja, bastava
     UMA chave existir no IndexedDB — o tema, um sinalizador de tela, uma
     gravação parcial — para o localStorage nativo inteiro nunca mais ser lido.
     E, como a partir daqui `window.localStorage` passa a apontar para esta
     fachada, o que ficou lá vira invisível para o app TODO: os dados continuam
     no navegador, íntegros, sem nenhuma porta.

     Agora é uma FUSÃO, e roda sempre: toda chave que existe no armazenamento
     antigo e não existe aqui é adotada. O IndexedDB continua mandando quando os
     dois têm a mesma chave (é o store mais novo), então nada é sobrescrito —
     só se acrescenta o que estava órfão.

     Ressuscitar algo apagado de propósito não é risco real: remover pela fachada
     também remove do nativo (mirrorNative 'del'), e o espelho nativo só guarda
     chaves pequenas — uma seção grande presente lá e ausente aqui é, por
     construção, dado antigo que nunca foi migrado. */
  function migrateFromNative() {
    if (!nativeLS) return 0;
    var adotadas = 0, bytes = 0;
    try {
      for (var i = 0; i < nativeLS.length; i++) {
        var k = nativeLS.key(i); if (k == null) continue;
        if (cache.has(k)) continue;                 // o IndexedDB manda
        var v = nativeLS.getItem(k); if (v == null) continue;
        cache.set(k, v);
        enqueue({ t: 'set', k: k, v: v });
        adotadas++; bytes += v.length;
      }
      if (adotadas) {
        invalidateKeys();
        try { console.warn('[armazenamento] ' + adotadas + ' chave(s) do armazenamento antigo adotadas (' + Math.round(bytes / 1024) + ' KB) — estavam invisíveis para o app'); } catch (e) {}
      }
    } catch (e) { _quiet(e); }
    return adotadas;
  }
  /* O armazenamento antigo continua acessível para a tela de Recuperação: sem
     isto, depois da fachada instalada não há mais como olhar lá dentro. */
  try { window.__nativeLS = nativeLS; } catch (e) { _quiet(e); }

  // Reaplica o tema a partir do cache já hidratado (garante o tema certo mesmo
  // quando o dado existe só no IndexedDB e não no localStorage nativo).
  function applyTheme() {
    try {
      var saved = cache.get('diario-estudos:theme');
      if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { _quiet(e); }
  }

  // Espera o DOM/scripts deferidos (xlsx, supabase) ficarem prontos antes de rodar o app.
  var domReady = new Promise(function (resolve) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', resolve, { once: true });
    else resolve();
  });

  function runApp() {
    var codeEl = document.getElementById('app-code');
    if (!codeEl) return;
    var s = document.createElement('script');
    s.textContent = codeEl.textContent; // executa em escopo global (idêntico ao original)
    document.body.appendChild(s);
    // app-code já rodou (é síncrono): esconde o overlay de carregamento.
    try {
      var ov = document.getElementById('app-loading');
      if (ov) { ov.classList.add('hide'); setTimeout(function () { if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }, 320); }
    } catch (e) { _quiet(e); }
  }

  /* ── SERVICE WORKER (opcional) ────────────────────────────────────────────
     Registrado DEPOIS que o app já carregou, para não competir por banda no
     arranque. Se sw.js não existir ao lado do arquivo, o registro falha e o
     erro é ignorado: o app segue idêntico, só sem funcionar offline.
     Protocolo file:// não suporta service worker — nem tentamos. */
  /* Sonda se os arquivos opcionais existem ANTES de usá-los.

     Por que sondar em vez de simplesmente tentar: num host estático como o
     GitHub Pages, pedir um arquivo inexistente devolve a PÁGINA 404 do host
     (HTML, status 404) — não um erro limpo. O navegador registra isso no
     console e o JavaScript não tem como silenciar. Sondando primeiro, quem
     sobe só o index.html não vê ruído nenhum: o app simplesmente não ativa o
     que não está lá.

     A checagem de Content-Type importa: um 404 que devolve HTML com status 200
     (alguns hosts fazem isso) passaria no teste de `ok` e o navegador tentaria
     executar HTML como service worker. */
  function existe(url, tipoEsperado) {
    return fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        if (!r || !r.ok) return false;
        var ct = (r.headers.get('content-type') || '').toLowerCase();
        return ct.indexOf(tipoEsperado) >= 0;
      })
      .catch(function () { return false; });
  }

  function ativarManifest() {
    // Sem manifest não há instalação na tela inicial — e nada mais muda.
    existe('manifest.webmanifest', 'json').then(function (temMf) {
      if (!temMf) return;
      try {
        var l = document.createElement('link');
        l.rel = 'manifest'; l.href = 'manifest.webmanifest';
        document.head.appendChild(l);
      } catch (e) {}
    });
  }

  function registrarSW() {
    try {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol === 'file:') return;   // file:// não suporta SW
      ativarManifest();
      existe('sw.js', 'javascript').then(function (temSw) {
        if (!temSw) return;                        // modo arquivo único: tudo normal
        registrarDeFato();
      });
    } catch (e) {}
  }

  function registrarDeFato() {
    try {
      /* updateViaCache:'none' é o detalhe que evita ficar preso numa versão
         antiga: sem ele o navegador pode servir o PRÓPRIO sw.js do cache HTTP
         por até 24h, e o worker velho continua entregando o index.html velho —
         o app "não atualiza" e um login que depende de código novo falha sem
         explicação. Com 'none', o sw.js é sempre buscado da rede. */
      navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
        .then(function (reg) {
          // Atualização disponível: aplica na próxima abertura, sem interromper.
          /* Um TOAST não resolvia: ele some em segundos, ninguém age, e a
             pessoa segue rodando código velho por dias — que é de onde vêm os
             "conflitos de login e uso" depois de uma publicação. O aviso agora
             FICA na tela até ser resolvido, e traz o botão que resolve. */
          reg.addEventListener('updatefound', function () {
            var novo = reg.installing;
            if (!novo) return;
            novo.addEventListener('statechange', function () {
              if (novo.state === 'installed' && navigator.serviceWorker.controller) {
                try { window.__avisarAtualizacao && window.__avisarAtualizacao(reg); } catch (e) {}
              }
            });
          });
          // Já havia um worker esperando quando esta aba abriu (outra aba viu a
          // atualização antes): o aviso vale igual.
          if (reg.waiting && navigator.serviceWorker.controller) {
            try { window.__avisarAtualizacao && window.__avisarAtualizacao(reg); } catch (e) {}
          }
          /* Procura versão nova ao voltar o foco (e a cada 30 min). O navegador
             só checa sozinho na navegação; num app instalado que fica aberto por
             dias, isso significava rodar código velho por dias. NÃO recarregamos
             sozinhos: o worker novo assume na próxima abertura. */
          var checar = function () { try { reg.update(); } catch (e) {} };
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') checar();
          });
          setInterval(checar, 1800000);
        })
        .catch(function () { /* sw.js ausente: modo arquivo único, tudo normal */ });
      /* Um worker novo assumindo o controle NÃO recarrega a página: recarga
         automática no meio do uso é exatamente o "pisca e carrega de novo" que
         queremos evitar. A versão nova entra na próxima abertura. */
    } catch (e) {}
  }
  /* Reparo manual, para quando o navegador ficar com uma versão antiga presa:
     window.__repararCache() apaga os caches, remove os workers e recarrega.
     Não toca em NENHUM dado de estudo — eles moram no IndexedDB. */
  window.__repararCache = function () {
    var tarefas = [];
    try { if (window.caches) tarefas.push(caches.keys().then(function (n) { return Promise.all(n.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
    } catch (e) {}
    return Promise.all(tarefas).catch(function () {}).then(function () {
      return window.__idbFlush ? window.__idbFlush() : null;
    }).then(function () { location.reload(); });
  };

  openIDB()
    .then(function (database) { db = database; return hydrate(); })
    .then(function () { migrateFromNative(); installShim(); applyTheme(); })
    .catch(function (err) {
      // IndexedDB indisponível (modo privado antigo, navegador sem suporte, etc.):
      // o app continua funcionando sobre o localStorage nativo, sem a fachada.
      try { console.error('IndexedDB indisponível — usando localStorage nativo:', err); } catch (e) { _quiet(e); }
    })
    .then(function () { return domReady; })
    .then(runApp)
    .then(function () { setTimeout(registrarSW, 1200); });   // banda livre primeiro
})();
</script>

</body>
