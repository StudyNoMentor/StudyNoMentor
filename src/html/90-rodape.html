  function isStudyKey(k) { return String(k || '').indexOf('diario-estudos:') === 0; }
  var DURABLE_PREFIX = 'diario-estudos:__durable_outbox__:';
  function isSafetyKey(k) { return String(k || '').indexOf(DURABLE_PREFIX) === 0; }
  function isMemoryKey(k) { return isStudyKey(k) && k !== THEME && !isSafetyKey(k); }

  /* A projeção de estudo começa VAZIA em toda abertura.

  setTimeout(function () {
    if (!nativeLS) return;
    try {
      var apagar = [];
      for (var i = 0; i < nativeLS.length; i++) {
        var k = nativeLS.key(i);

      }

    } catch (_) {}
    try {
      if (window.indexedDB && indexedDB.deleteDatabase) indexedDB.deleteDatabase('diario-estudos-db');
    } catch (_) {}

    try {

      if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved);

  }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', resolve, { once: true });
    else resolve();
  });

    var codeEl = document.getElementById('app-code');
    if (!codeEl) return;

    s.textContent = codeEl.textContent;
    document.body.appendChild(s);
    try {

  }

    var jobs = [];
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (_) {}

  };
