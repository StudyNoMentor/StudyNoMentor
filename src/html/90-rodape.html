</script>

<!-- ============================================================
     CAMADA DE PERSISTÊNCIA: IndexedDB
     ------------------------------------------------------------
     O app usa a API síncrona do localStorage, mas os dados vivem no IndexedDB.
     A fachada abaixo mantém um cache síncrono em memória e faz write-through
     assíncrono para o IndexedDB.

     IMPORTANTE PARA O STARTUP:
     versões antigas copiavam TODO o IndexedDB para a memória antes de liberar a
     tela. Isso incluía perfis que nem estavam sendo usados e seus backups locais;
     conforme o histórico crescia, "Carregando seus estudos…" podia durar vários
     segundos. Agora o caminho crítico hidrata apenas:
       • chaves globais/índice;
       • namespace completo do perfil ativo.
     Outros perfis ficam frios e são hidratados sob demanda ao serem abertos.
     ============================================================ -->
<script>
(function () {
  'use strict';

  var IDB_NAME = 'diario-estudos-db', IDB_STORE = 'kv', IDB_VERSION = 1;
  var MIRROR_MAX = 100000;
  var PROFILE_RE = /^diario-estudos:u:([^:]+):/;
  var VHIST_RES = [
    /^diario-estudos:vhist:([^:]+)$/,
    /^diario-estudos:vhist-day:([^:]+)$/,
    /^diario-estudos:vhist-auto:([^:]+)$/
  ];
  var ACTIVE_PROFILE_KEY = 'diario-estudos:active-profile';

  var nativeLS = null;
  try { nativeLS = window.localStorage; } catch (e) { nativeLS = null; }

  var cache = new Map();
  var _keys = null;
  function invalidateKeys() { _keys = null; }

  var db = null, queue = [], flushing = false;
  var allDiskKeys = [];
  var hydratedProfiles = Object.create(null);
  var profileHydrations = Object.create(null);
  var touchedSinceBoot = new Set();
  var bootHydrateStarted = 0;
  var bootStats = window.__idbStartupStats = {
    strategy: 'active-profile-hot-v1',
    activeProfileId: null,
    totalKeys: 0,
    hotKeys: 0,
    coldKeys: 0,
    hotChars: 0,
    hydrateMs: 0,
    appCodeMs: 0,
    visibleMs: 0
  };

  function nowMs() { try { return performance.now(); } catch (e) { return Date.now(); } }

  function openIDB() {
    if (window.__idbBoot && typeof window.__idbBoot.then === 'function') {
      return window.__idbBoot.catch(function () { return abrirDireto(); });
    }
    return abrirDireto();
  }
  function abrirDireto() {
    return new Promise(function (resolve, reject) {
      var req;
      try { req = indexedDB.open(IDB_NAME, IDB_VERSION); }
      catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        try {
          var d = req.result;
          if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE);
        } catch (e) { /* upgrade best-effort */ }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
      req.onblocked = function () { reject(new Error('IndexedDB bloqueado por outra aba')); };
    });
  }

  // ---- write-through assíncrono ----
  var esperandoDisco = [];
  function avisarDisco() {
    var lista = esperandoDisco; esperandoDisco = [];
    for (var i = 0; i < lista.length; i++) { try { lista[i](); } catch (e) { /* noop */ } }
  }
  window.__idbFlush = function () {
    if (!db || (!queue.length && !flushing)) return Promise.resolve();
    return new Promise(function (resolve) {
      esperandoDisco.push(resolve);
      scheduleFlush();
      setTimeout(resolve, 2000);
    });
  };
  try {
    window.addEventListener('pagehide', function () { try { window.__idbFlush(); } catch (e) { /* noop */ } });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { try { window.__idbFlush(); } catch (e) { /* noop */ } }
    });
  } catch (e) { /* noop */ }

  function scheduleFlush() { if (!flushing) { flushing = true; Promise.resolve().then(flush); } }

  var falhasSeguidas = 0;
  var ESPERA_RETENTAR = [400, 2000, 8000];
  function devolverAFila(ops) {
    if (ops && ops.length) queue = ops.concat(queue);
    flushing = false;
    var tentativa = falhasSeguidas++;
    if (tentativa < ESPERA_RETENTAR.length) {
      setTimeout(scheduleFlush, ESPERA_RETENTAR[tentativa]);
      return;
    }
    falhasSeguidas = 0;
    try { if (typeof window.__idbFalhouAoGravar === 'function') window.__idbFalhouAoGravar(queue.length); }
    catch (e) { /* app ainda pode não ter carregado */ }
    avisarDisco();
  }

  function flush() {
    if (!db) { flushing = false; avisarDisco(); return; }
    var ops = queue; queue = [];
    if (!ops.length) { flushing = false; avisarDisco(); return; }
    var tx, store;
    try { tx = db.transaction(IDB_STORE, 'readwrite'); store = tx.objectStore(IDB_STORE); }
    catch (e) { devolverAFila(ops); return; }
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      try {
        if (op.t === 'set') store.put(op.v, op.k);
        else if (op.t === 'del') store.delete(op.k);
        else if (op.t === 'clear') store.clear();
      } catch (e) { /* a transação sinaliza falha abaixo */ }
    }
    tx.oncomplete = function () {
      flushing = false; falhasSeguidas = 0;
      if (queue.length) scheduleFlush(); else avisarDisco();
    };
    tx.onerror = function () { devolverAFila(ops); };
    tx.onabort = function () { devolverAFila(ops); };
  }
  function enqueue(op) { queue.push(op); scheduleFlush(); }

  function mirrorNative(t, k, v) {
    if (!nativeLS) return;
    try {
      if (t === 'set') { if (v.length < MIRROR_MAX) nativeLS.setItem(k, v); else nativeLS.removeItem(k); }
      else if (t === 'del') nativeLS.removeItem(k);
    } catch (e) { /* espelho é best-effort */ }
  }

  var LS = {
    getItem: function (k) { k = String(k); return cache.has(k) ? cache.get(k) : null; },
    setItem: function (k, v) {
      k = String(k); v = String(v); touchedSinceBoot.add(k);
      if (!cache.has(k)) invalidateKeys();
      cache.set(k, v);
      enqueue({ t: 'set', k: k, v: v });
      mirrorNative('set', k, v);
    },
    removeItem: function (k) {
      k = String(k); touchedSinceBoot.add(k);
      if (cache.has(k)) { cache.delete(k); invalidateKeys(); }
      enqueue({ t: 'del', k: k });
      mirrorNative('del', k);
    },
    clear: function () {
      cache.clear(); invalidateKeys(); touchedSinceBoot.add('*');
      enqueue({ t: 'clear' });
      try { if (nativeLS) nativeLS.clear(); } catch (e) { /* noop */ }
    },
    key: function (i) {
      i = i >> 0;
      if (!_keys) _keys = Array.from(cache.keys());
      return (i >= 0 && i < _keys.length) ? _keys[i] : null;
    }
  };
  Object.defineProperty(LS, 'length', { get: function () { return cache.size; } });

  function installShim() {
    try {
      Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { return LS; } });
      window.__idbShim = true;
      return true;
    } catch (e) {
      try { window.localStorage = LS; window.__idbShim = true; return true; }
      catch (e2) { window.__idbShim = false; return false; }
    }
  }

  function requestResult(req) {
    return new Promise(function (resolve) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(undefined); };
    });
  }

  function readDiskKey(key) {
    if (!db) return Promise.resolve(undefined);
    try {
      var tx = db.transaction(IDB_STORE, 'readonly');
      return requestResult(tx.objectStore(IDB_STORE).get(key));
    } catch (e) { return Promise.resolve(undefined); }
  }

  function readAllDiskKeys() {
    if (!db) return Promise.resolve([]);
    if (allDiskKeys.length) return Promise.resolve(allDiskKeys.slice());
    return new Promise(function (resolve) {
      var tx, store, req;
      try {
        tx = db.transaction(IDB_STORE, 'readonly'); store = tx.objectStore(IDB_STORE);
        if (typeof store.getAllKeys === 'function') {
          req = store.getAllKeys();
          req.onsuccess = function () {
            allDiskKeys = (req.result || []).map(String);
            resolve(allDiskKeys.slice());
          };
          req.onerror = function () { resolve([]); };
          return;
        }
        var out = [];
        req = store.openKeyCursor();
        req.onsuccess = function () {
          var cur = req.result;
          if (cur) { out.push(String(cur.key)); cur.continue(); }
          else { allDiskKeys = out; resolve(out.slice()); }
        };
        req.onerror = function () { resolve([]); };
      } catch (e) { resolve([]); }
    });
  }

  function vhistOwner(k) {
    for (var i = 0; i < VHIST_RES.length; i++) {
      var m = VHIST_RES[i].exec(k); if (m) return m[1];
    }
    return null;
  }
  function profileOwner(k) {
    var m = PROFILE_RE.exec(k); return m ? m[1] : null;
  }
  function belongsToProfile(k, id) {
    if (!id) return false;
    return profileOwner(k) === id || vhistOwner(k) === id;
  }
  function isHotStartupKey(k, activeId) {
    var p = profileOwner(k);
    if (p) return !!activeId && p === activeId;
    var vh = vhistOwner(k);
    if (vh) return !!activeId && vh === activeId;
    return true; // índice de perfis, sessão, tema, revisões e legado global
  }

  function loadKeysIntoCache(keys, countStats) {
    keys = (keys || []).filter(function (k) { return !touchedSinceBoot.has(String(k)); });
    if (!keys.length || !db) return Promise.resolve(0);
    return new Promise(function (resolve) {
      var tx, store, pend = keys.length, chars = 0;
      try { tx = db.transaction(IDB_STORE, 'readonly'); store = tx.objectStore(IDB_STORE); }
      catch (e) { resolve(0); return; }
      function done() { if (--pend <= 0) { invalidateKeys(); resolve(chars); } }
      keys.forEach(function (key) {
        var req;
        try { req = store.get(key); }
        catch (e) { done(); return; }
        req.onsuccess = function () {
          if (!touchedSinceBoot.has(key) && req.result !== undefined) {
            var v = String(req.result); cache.set(key, v); chars += v.length;
          }
          done();
        };
        req.onerror = done;
      });
    }).then(function (chars) {
      if (countStats) bootStats.hotChars += chars;
      return chars;
    });
  }

  async function hydrateHot() {
    bootHydrateStarted = nowMs();
    if (!db) return;
    var activeId = null;
    try { activeId = nativeLS && nativeLS.getItem(ACTIVE_PROFILE_KEY); } catch (e) { activeId = null; }
    if (!activeId) {
      var diskActive = await readDiskKey(ACTIVE_PROFILE_KEY);
      if (diskActive != null) activeId = String(diskActive);
    }
    bootStats.activeProfileId = activeId || null;
    var keys = await readAllDiskKeys();
    bootStats.totalKeys = keys.length;
    var hot = keys.filter(function (k) { return isHotStartupKey(k, activeId); });
    bootStats.hotKeys = hot.length;
    bootStats.coldKeys = Math.max(0, keys.length - hot.length);
    await loadKeysIntoCache(hot, true);
    if (activeId) hydratedProfiles[activeId] = true;
    bootStats.hydrateMs = Math.round(nowMs() - bootHydrateStarted);
  }

  async function hydrateProfile(id) {
    id = String(id || ''); if (!id || !db) return false;
    if (hydratedProfiles[id]) return true;
    if (profileHydrations[id]) return profileHydrations[id];
    profileHydrations[id] = (async function () {
      var keys = await readAllDiskKeys();
      var mine = keys.filter(function (k) { return belongsToProfile(k, id); });
      await loadKeysIntoCache(mine, false);
      hydratedProfiles[id] = true;
      return true;
    })().finally(function () { delete profileHydrations[id]; });
    return profileHydrations[id];
  }

  window.__idbHydrateProfile = hydrateProfile;
  window.__idbHasProfileNamespace = function (id) {
    id = String(id || '');
    if (!id) return false;
    return allDiskKeys.some(function (k) { return profileOwner(k) === id; });
  };
  window.__idbColdProfileIds = function () {
    var seen = Object.create(null), out = [];
    allDiskKeys.forEach(function (k) {
      var id = profileOwner(k);
      if (id && !seen[id] && !hydratedProfiles[id]) { seen[id] = 1; out.push(id); }
    });
    return out;
  };

  /* Adoção do localStorage antigo. Como o espelho guarda apenas valores pequenos,
     esta fusão é barata e mantém a compatibilidade/rede de recuperação existente. */
  function migrateFromNative() {
    if (!nativeLS) return 0;
    var adotadas = 0, bytes = 0;
    try {
      for (var i = 0; i < nativeLS.length; i++) {
        var k = nativeLS.key(i); if (k == null || cache.has(k)) continue;
        var v = nativeLS.getItem(k); if (v == null) continue;
        cache.set(k, v); enqueue({ t: 'set', k: k, v: v });
        adotadas++; bytes += v.length;
      }
      if (adotadas) {
        invalidateKeys();
        try { console.warn('[armazenamento] ' + adotadas + ' chave(s) antigas adotadas (' + Math.round(bytes / 1024) + ' KB)'); } catch (e) { /* noop */ }
      }
    } catch (e) { /* recuperação best-effort */ }
    return adotadas;
  }
  try { window.__nativeLS = nativeLS; } catch (e) { /* noop */ }

  function applyTheme() {
    try {
      var saved = cache.get('diario-estudos:theme');
      if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { /* noop */ }
  }

  var domReady = new Promise(function (resolve) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', resolve, { once: true });
    else resolve();
  });

  function runApp() {
    var codeEl = document.getElementById('app-code');
    if (!codeEl) return;
    var appStart = nowMs();
    var s = document.createElement('script');
    s.textContent = codeEl.textContent;
    document.body.appendChild(s);
    bootStats.appCodeMs = Math.round(nowMs() - appStart);
    bootStats.visibleMs = Math.round(nowMs());
    try {
      if (window.StartupTrace && StartupTrace.mark) StartupTrace.mark('app-visivel', {
        hydrateMs: bootStats.hydrateMs,
        appCodeMs: bootStats.appCodeMs,
        totalKeys: bootStats.totalKeys,
        hotKeys: bootStats.hotKeys,
        coldKeys: bootStats.coldKeys
      });
      if (bootStats.visibleMs > 2000) console.warn('[startup] abertura lenta', JSON.parse(JSON.stringify(bootStats)));
    } catch (e) { /* telemetria local nunca bloqueia */ }
    try {
      var ov = document.getElementById('app-loading');
      if (ov) { ov.classList.add('hide'); setTimeout(function () { if (ov && ov.parentNode) ov.parentNode.removeChild(ov); }, 320); }
    } catch (e) { /* noop */ }
  }

  /* ── SERVICE WORKER opcional ───────────────────────────────────────────── */
  function existe(url, tipoEsperado) {
    return fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) {
        if (!r || !r.ok) return false;
        var ct = (r.headers.get('content-type') || '').toLowerCase();
        return ct.indexOf(tipoEsperado) >= 0;
      })
      .catch(function () { return false; });
  }
  function ativarManifest() {
    existe('manifest.webmanifest', 'json').then(function (temMf) {
      if (!temMf) return;
      try {
        var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
      } catch (e) { /* opcional */ }
    });
  }
  function registrarSW() {
    try {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      ativarManifest();
      existe('sw.js', 'javascript').then(function (temSw) { if (temSw) registrarDeFato(); });
    } catch (e) { /* opcional */ }
  }
  function registrarDeFato() {
    try {
      navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
        .then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var novo = reg.installing; if (!novo) return;
            novo.addEventListener('statechange', function () {
              if (novo.state === 'installed' && navigator.serviceWorker.controller) {
                try { window.__avisarAtualizacao && window.__avisarAtualizacao(reg); } catch (e) { /* noop */ }
              }
            });
          });
          if (reg.waiting && navigator.serviceWorker.controller) {
            try { window.__avisarAtualizacao && window.__avisarAtualizacao(reg); } catch (e) { /* noop */ }
          }
          var checar = function () { try { reg.update(); } catch (e) { /* noop */ } };
          document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checar(); });
          setInterval(checar, 1800000);
        })
        .catch(function () { /* modo arquivo único */ });
    } catch (e) { /* opcional */ }
  }

  window.__repararCache = function () {
    var tarefas = [];
    try { if (window.caches) tarefas.push(caches.keys().then(function (n) { return Promise.all(n.map(function (k) { return caches.delete(k); })); })); } catch (e) { /* noop */ }
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      }
    } catch (e) { /* noop */ }
    return Promise.all(tarefas).catch(function () { return null; }).then(function () {
      return window.__idbFlush ? window.__idbFlush() : null;
    }).then(function () { location.reload(); });
  };

  openIDB()
    .then(function (database) { db = database; return hydrateHot(); })
    .then(function () { migrateFromNative(); installShim(); applyTheme(); })
    .catch(function (err) {
      try { console.error('IndexedDB indisponível — usando localStorage nativo:', err); } catch (e) { /* noop */ }
    })
    .then(function () { return domReady; })
    .then(runApp)
    .then(function () { setTimeout(registrarSW, 1200); });
})();
</script>

</body>
