name: Validar estabilidade de Extras
on:
  push:
    branches: [fix/extras-overlays-adaptive-performance]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Integrar camada ao montador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.mjs'); s=p.read_text()
          if 'extras-stability-v1' not in s:
            old="""  SEP('\\n</style>\\n\\n<style id=\"reforco-adaptativo-v1\">\\n'), S('css/15-reforco-adaptativo.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
            new="""  SEP('\\n</style>\\n\\n<style id=\"reforco-adaptativo-v1\">\\n'), S('css/15-reforco-adaptativo.css'),\n  SEP('\\n</style>\\n\\n<style id=\"extras-stability-v1\">\\n'), S('css/16-extras-stability.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
            if old not in s: raise SystemExit('ancora CSS nao encontrada')
            s=s.replace(old,new,1)
          if "'js/59-extras-stability.js'" not in s:
            old="""    'js/59-reforco-adaptativo.js',\n    'js/59-tec-layout-v2.js',"""
            new="""    'js/59-reforco-adaptativo.js',\n    'js/59-tec-layout-v2.js',\n    'js/59-extras-stability.js',"""
            if old not in s: raise SystemExit('ancora JS nao encontrada')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Testar contratos de estabilidade
        run: |
          node --check src/js/59-extras-stability.js
          node testes/extras-estabilidade.mjs
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Reproduzir ativacao adaptativa no navegador
        run: node testes/extras-estabilidade-browser.mjs
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir produto aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.mjs index.html src/manifesto.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build: integra estabilidade de Extras'
          git push origin HEAD:fix/extras-overlays-adaptive-performance
