name: TMP Law Card Build

on:
  push:
    branches: [fix/extras-lei-seca-status-ci-preflight]
    paths:
      - .github/workflows/tmp-law-card-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extras-lei-seca-status-ci-preflight

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar patch focado
        run: python .github/patch-law-card-v2.py

      - name: Gerar artefatos publicados
        run: |
          node build.mjs
          node --check testes/extras-ux100-browser.mjs

      - name: Persistir apenas produto validado
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/patch-law-card-v2.py
          git add src/css/18-extras-ux100.css testes/extras-ux100-browser.mjs index.html sw.js src/manifesto.json .github/patch-law-card-v2.py
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração gerada.'
          else
            git commit -m 'fix: diferencia Lei Seca aberta de concluída e afasta ações'
            git push origin HEAD:fix/extras-lei-seca-status-ci-preflight
          fi
