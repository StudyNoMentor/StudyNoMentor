name: Validacao temporaria agenda reforco
on:
  push:
    branches: [fix/reforco-agenda-auto]
    paths: ['.github/workflows/tmp-reforco-agenda.yml']
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reforco-agenda-auto
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar montador e harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.mjs')
          s=p.read_text(encoding='utf-8')
          old="    'js/51a-tec-scope-consistency.js',\n"
          new=old+"    'js/51b-reforco-agenda-auto.js',\n"
          if "'js/51b-reforco-agenda-auto.js'" not in s:
              if old not in s: raise SystemExit('ancora 51a nao encontrada')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          t=Path('testes/atividades-extras.mjs')
          q=t.read_text(encoding='utf-8')
          q=q.replace(',Intl,globalThis:null};', ',Intl};')
          q=q.replace('\ncontexto.globalThis=contexto;', '')
          t.write_text(q,encoding='utf-8')
          PY
      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gerar bundle
        run: node build.mjs
      - name: Verificar tudo
        id: verify
        shell: bash
        run: |
          set +e
          node verificar.mjs > /tmp/verificar.log 2>&1
          code=$?
          cat /tmp/verificar.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commitar somente se tudo passou
        if: steps.verify.outputs.code == '0'
        run: |
          git config user.name 'StudyNoMentor'
          git config user.email 'jairo258@hotmail.com'
          git add build.mjs testes/atividades-extras.mjs index.html src/manifesto.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Integra agenda automatica ao bundle validado'
            git push origin HEAD:fix/reforco-agenda-auto
          fi
      - name: Registrar falha sem gerar commit de produto
        if: steps.verify.outputs.code != '0'
        run: echo 'A verificacao encontrou regressao; nenhum bundle foi gravado.'
