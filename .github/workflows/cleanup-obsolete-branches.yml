            "fix/cards-mais-menu-a11y-export-20260922"
            "fix/cards-mobile-parity-10of10-20260922"
            "fix/cards-parity-hardening-20260922"
            "fix/cards-reviewer-empty-front-20260922"
            "fix/cards-reviewer-session-parity-20260922"
            "fix/cloud-authoritative-study-entries"
            "fix/cloud-sync-button"
            "fix/deploy-consistency-self-heal-v1"
            "fix/final-relational-cleanup-20260919"
            "fix/mobile-entry-sync-conflict"
            "fix/motor-real-data-audit-v3"
