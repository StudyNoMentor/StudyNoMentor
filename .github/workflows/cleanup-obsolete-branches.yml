            "audit/integracao-tec-total-fast-ci"
            "audit/integracao-tec-total-fast-ci-atomic"
            "audit/integracao-tec-total-pr"
            "audit/integracao-tec-v14"
            "audit/site-visual-total"
            "cards-10of10-paridade-total-20260922"
            "cards-paridade-10of10-total-20260922"
            "cards-paridade-pratica-10of10-20260922"
            "claude/affectionate-davinci-qic1me"
            "claude/auto-logout-inactivity-9egzb9"
