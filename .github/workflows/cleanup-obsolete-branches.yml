            "fix/tec-analise-multifiltro-motor-hierarquia"
            "fix/tec-final-audit-cleanup"
            "fix/tec-historico-validacao-total"
            "fix/tec-motor-hierarquia-ux-v2"
            "fix/tec-motores-oculta-plano-legado"
            "fix/tec-reconstruction-stability-v2"
            "fix/tec-single-question-retry-diagnostics"
            "fix/update-cloud-reconcile"
            "fix/ux-hierarquia-prontidao-ci"
            "hotfix/drain-outbox-on-session-handoff"
            "hotfix/mobile-stale-fastpath"
            "hotfix/sync-integrity-session-realtime"
            "refactor/motor-sugestao-unico-v5"
            "sync-v2-stage2-canonical-sections"
            "sync-v2-stage3-session-entry-barrier"
            "test/cards-certificacao-10of10-6000x365-20260922"
          )
          failed=()
          deleted=0
          for b in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$b" >/dev/null 2>&1; then
              echo "Deleting $b"
              if git push origin --delete "$b"; then
                deleted=$((deleted+1))
              else
                failed+=("$b")
              fi
            else
              echo "Already absent: $b"
            fi
          done
          echo "Deleted: $deleted"
          if (("${#failed[@]}" > 0)); then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi
