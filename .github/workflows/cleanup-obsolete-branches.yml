            "claude/shared-chat-review-nvx392"
            "claude/study-capabilities-0en5i1"
            "claude/youthful-brown-m517p5"
            "cleanup/auditoria-fina-legados-main"
            "cleanup/cards-verificacao-enxuta-20260922"
            "cleanup/deep-relational-legacy-20260919"
            "cleanup/remove-assuntos-abaixo-regua"
            "cleanup/remove-pre-relational-legacy"
            "cleanup/remove-relational-legacy"
            "feat/anki-android-layout-20260923"
            "feat/anki-official-engine-20260923"
            "feat/anki-official-full-surface-20260923"
            "feat/anki-oficial-launcher-20260922"
            "feat/cards-anki-ui-parity-safe-20260922"
            "feat/cards-final-product-parity-20260922"
            "feat/cards-image-occlusion-stock-parity-20260922"
            "feat/cards-paridade-maxima-editor-io-20260922"
