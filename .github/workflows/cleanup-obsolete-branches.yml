name: Cleanup obsolete branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete audited obsolete branches
        shell: bash
        run: |
          set -u
          branches=(
            "audit/cards-anki-longterm-certification-20260921"
            "audit/cards-final-certification-20260923"
            "audit/integracao-tec-fast-safe"
            "audit/integracao-tec-fast-safe-final"
            "audit/integracao-tec-final"
            "audit/integracao-tec-one-commit"
            "audit/integracao-tec-review"
