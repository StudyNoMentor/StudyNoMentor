            "feat/tec-import-manager-completo"
            "feat/tec-integrated-workspace"
            "feat/tec-motor-cards-legacy-style"
            "feat/tec-panorama-motores-compacto"
            "feat/tec-reconstrucao-caderno"
            "fix/anki-android-native-launcher-20260922"
            "fix/anki-official-engine-connect-20260923"
            "fix/anki-study-native-layout-20260923"
            "fix/cards-anki-10of10-20260922"
            "fix/cards-anki-26092-total-parity-20260922"
            "fix/cards-anki-export-parity-20260922"
            "fix/cards-anki-final-parity-20260922"
