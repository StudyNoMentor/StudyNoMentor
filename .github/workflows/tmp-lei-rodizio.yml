name: Validar cache do Plano e rodizio de lei seca
on:
  push:
    branches:
      - feat/lei-seca-rodizio-perf-extras
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validar sintaxe
        run: node --check src/js/56-leis-rodizio.js
      - name: Testes focais novos
        run: node testes/lei-rodizio-perf.mjs
      - name: Regressao do reforco
        run: |
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Reconstruir artefatos
        run: |
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir somente apos tudo verde
        run: |
          rm -f .github/workflows/tmp-lei-rodizio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada a persistir"
          else
            git commit -m "build: publica cache rapido e rodizio de lei seca"
            git push
          fi
