name: TMP Law Card V3

on:
  push:
    branches: [fix/extras-lei-seca-status-ci-preflight]
    paths:
      - .github/workflows/tmp-law-card-v3.yml

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/extras-lei-seca-status-ci-preflight

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar correção determinística
        run: python .github/patch-law-card-v3.py

      - name: Preflight e build
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check testes/extras-ux100-browser.mjs
          node build.mjs

      - name: Preparar Playwright
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Validar somente UX de Extras
        run: node testes/extras-ux100-browser.mjs

      - name: Persistir somente após teste verde
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/patch-law-card-v3.py
          git add src/css/18-extras-ux100.css testes/extras-ux100-browser.mjs index.html sw.js src/manifesto.json .github/patch-law-card-v3.py
          git commit -m 'fix: estabiliza visual e auditoria do card de Lei Seca'
          git push origin HEAD:fix/extras-lei-seca-status-ci-preflight
