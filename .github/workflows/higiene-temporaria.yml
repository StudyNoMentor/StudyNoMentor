name: Higiene temporaria do verificador

on:
  push:
    branches: [chore/main-hygiene-audit-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-verificador:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/main-hygiene-audit-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remover invariante legada SEGUNDO PLANO
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='verificar.mjs';
          let s=fs.readFileSync(p,'utf8');
          const antigo="      edital: !!q('.pl-edital'), segundo: /SEGUNDO PLANO/i.test(txt('#plano-lista')),";
          const novo="      edital: !!q('.pl-edital'), fonte: !!q('[data-tpm-output]') || !!q('[data-tpm-selector]'),";
          const assertAntigo="  est.segundo ? ok('segundo plano (sem diagnostico) presente') : erro('segundo plano ausente');";
          const assertNovo="  est.fonte ? ok('fonte explicita das sugestoes presente') : erro('fonte explicita das sugestoes ausente');";
          if(!s.includes(antigo)){
            if(s.includes(novo)&&s.includes(assertNovo)){console.log('verificador já atualizado');process.exit(0);}
            throw new Error('invariante antiga não encontrada exatamente; abortando sem alterar');
          }
          if(!s.includes(assertAntigo))throw new Error('asserção antiga não encontrada exatamente; abortando sem alterar');
          s=s.replace(antigo,novo).replace(assertAntigo,assertNovo).replaceAll('lista, segundo plano e lacunas do edital','lista, fonte explicita das sugestoes e lacunas do edital');
          fs.writeFileSync(p,s);
          NODE
          node --check verificar.mjs
          if git diff --quiet -- verificar.mjs; then exit 0; fi
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add verificar.mjs
          git commit -m 'test: atualiza invariante do Plano para fonte explicita'
          git push origin HEAD:chore/main-hygiene-audit-v1
