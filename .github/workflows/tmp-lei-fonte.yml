name: Integrar fonte lei seca no painel moderno
on:
  push:
    branches:
      - feat/lei-seca-rodizio-perf-extras
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar integracao da fonte
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/js/56-leis-rodizio.js')
          s=p.read_text()
          marker="  if (typeof window !== 'undefined') window.LeiRodizio = LeiRodizio;\n\n  if (typeof DB !== 'undefined') {"
          bloco=r'''  if (typeof window !== 'undefined') window.LeiRodizio = LeiRodizio;

  /* O painel moderno precisa distinguir a rotina gerenciada de lei seca das
     atividades realmente manuais. Isso mantém filtros e contagens semânticos. */
  if (typeof ExtrasModern !== 'undefined') {
    const fonteModernAnterior = ExtrasModern.fonte;
    ExtrasModern.fonte = function (x) {
      if (LeiRodizio.eExtra(x)) return 'lei';
      return fonteModernAnterior.call(this, x);
    };
    const filtroFonteAnterior = ExtrasModern.filtroFonte;
    ExtrasModern.filtroFonte = function (entry) {
      if (this.view === 'lei') return this.fonte(entry.x) === 'lei';
      return filtroFonteAnterior.call(this, entry);
    };
    const gruposAnterior = ExtrasModern.grupos;
    ExtrasModern.grupos = function (c) {
      if (this.view !== 'lei') return gruposAnterior.call(this, c);
      const anterior = this.view;
      this.view = 'all';
      let grupos;
      try { grupos = gruposAnterior.call(this, c); }
      finally { this.view = anterior; }
      return grupos.map(([k, titulo, ico, arr]) => [k, titulo, ico, arr.filter(e => this.fonte(e.x) === 'lei')]);
    };
    const coletarAnterior = ExtrasModern.coletar;
    ExtrasModern.coletar = function (screen) {
      const c = coletarAnterior.call(this, screen);
      c.fontes = c.fontes || {};
      c.fontes.lei = DB.getExtras().filter(x => x && x.status !== 'concluida' && LeiRodizio.eExtra(x)).length;
      return c;
    };
    const agendaAnterior = ExtrasModern.decorarAgenda;
    ExtrasModern.decorarAgenda = function (screen, c) {
      const r = agendaAnterior.call(this, screen, c);
      const host = document.querySelector('#extras-agenda .exm-filters');
      if (host && !host.querySelector('[data-exm-view="lei"]')) {
        const tmp = document.createElement('div');
        tmp.innerHTML = this.chip('lei', 'Lei seca', (c.fontes && c.fontes.lei) || 0);
        const b = tmp.firstElementChild;
        if (b) {
          host.appendChild(b);
          b.addEventListener('click', () => { this.view = 'lei'; screen.selDay = todayLocal(); screen.render(); });
        }
      }
      return r;
    };
    const cardsModernAnterior = ExtrasModern.decorarCards;
    ExtrasModern.decorarCards = function (list, entries) {
      const r = cardsModernAnterior.call(this, list, entries);
      list.querySelectorAll('.exd').forEach(card => {
        const e = DB.getExtra(card.dataset.id);
        if (!LeiRodizio.eExtra(e)) return;
        const tag = card.querySelector('.exm-source');
        if (tag) {
          tag.textContent = 'Lei seca';
          tag.classList.remove('manual', 'plano', 'reforco');
          tag.classList.add('lei');
        }
      });
      return r;
    };
  }

  if (typeof DB !== 'undefined') {'''
          if marker not in s:
              raise SystemExit('marcador de integracao nao encontrado')
          p.write_text(s.replace(marker, bloco, 1))

          css=Path('src/css/10-lei-rodizio.css')
          c=css.read_text()
          regra='\n.exm-source.lei{background:color-mix(in srgb,#0f9d63 10%,var(--surface));color:#0a6b44;border-color:color-mix(in srgb,#0f9d63 20%,var(--border))}\n'
          if '.exm-source.lei{' not in c:
              css.write_text(c.rstrip()+regra)
          PY
      - name: Validar sintaxe e focais
        run: |
          node --check src/js/56-leis-rodizio.js
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Reconstruir artefatos
        run: |
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias e Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir somente apos tudo verde
        run: |
          rm -f .github/workflows/tmp-lei-fonte.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separa lei seca como fonte gerenciada em Extras"
          git push
