name: Fix ciclo real temporario
on:
  push:
    branches:
      - fix/plano-ciclos-rotacao-real
    paths:
      - .github/workflows/fix-ciclo-real-temp.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plano-ciclos-rotacao-real
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Corrigir fronteiras da execução
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/js/51a-tec-scope-consistency.js')
          s=p.read_text()
          s=s.replace('  window.PlanoExecucaoReal = {','  globalThis.PlanoExecucaoReal = {')
          s,n=re.subn(r"\n      if \(motivo !== 'diagnostico' && x\.status && x\.taxa != null && x\.taxa < n\(p\.metaDominio, 85\)\) \{.*?\n      \}\n      return x;", "\n      return x;", s, count=1, flags=re.S)
          assert n==1, 'bloco de conselho não encontrado'
          old="if (v && extra && extra.status !== 'concluida' && o && !o.modeloExecucao && (v.feito || 0) === 0) {"
          new="if (v && extra && extra.status !== 'concluida' && o && !o.modeloExecucao && (v.feito || 0) === 0 && Number(extra.alvo) > MAX_CICLO * 4) {"
          assert old in s, 'condição de migração não encontrada'
          s=s.replace(old,new,1)
          s,n=re.subn(r"\n        const ritmo = document\.querySelector\('#extras-curso \.exc-kpi-ritmo'\);.*?\n        \}", "", s, count=1, flags=re.S)
          assert n==1, 'override de ritmo não encontrado'
          alvo="""    document.querySelectorAll('.plm-amostra span').forEach(s => {\n      if (s.textContent.indexOf('q p/ medir') >= 0) s.textContent = s.textContent.replace('q p/ medir', 'faltam p/ amostra');\n    });"""
          ins=alvo+"""\n    /* O motor mantém a formula estatística intacta. Só a APRESENTAÇÃO deixa de\n       transformar uma amostra grande em ordem para uma única sessão. */\n    document.querySelectorAll('.pl-direcao span:last-child, .pl-guia-acao').forEach(el => {\n      el.textContent = String(el.textContent || '').replace(/\\b(\\d+)\\s+questões\\b/g, (m, q) =>\n        Number(q) > MAX_CICLO ? `uma amostra de ${q} questões acumuladas em vários ciclos` : m);\n    });\n    document.querySelectorAll('.pl-base').forEach(el => {\n      const txt = String(el.textContent || '');\n      if (txt.indexOf('Para a próxima medição') >= 0 && !el.querySelector('.pl-exec-nota')) {\n        const nota = document.createElement('span'); nota.className = 'pl-exec-nota';\n        nota.textContent = ` Não faça essa amostra de uma vez: acumule-a em ciclos de até ${MAX_CICLO} questões, alternando matérias.`;\n        el.appendChild(nota);\n      }\n      if (txt.indexOf('Custo estimado de') === 0 && !el.querySelector('.pl-exec-nota')) {\n        const nota = document.createElement('span'); nota.className = 'pl-exec-nota';\n        nota.textContent = ` Este número serve para comparar esforço; a atividade prática usa ciclo de até ${MAX_CICLO} questões.`;\n        el.appendChild(nota);\n      }\n    });"""
          assert alvo in s, 'ponto de apresentação não encontrado'
          s=s.replace(alvo,ins,1)
          p.write_text(s)
          PY
          node --check src/js/51a-tec-scope-consistency.js
          node testes/atividades-extras.mjs
          node build.mjs
          node build.mjs --check
      - name: Gravar correção
        run: |
          git config user.name StudyNoMentor
          git config user.email jairo258@hotmail.com
          git add src/js/51a-tec-scope-consistency.js index.html src/manifesto.json sw.js
          git commit -m "Restringe ciclos curtos à camada operacional"
          git push origin HEAD:fix/plano-ciclos-rotacao-real
