name: Higiene temporaria do seletor legado do Plano

on:
  push:
    branches: [chore/main-hygiene-audit-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/main-hygiene-audit-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remover apenas a selecao antiga do Plano
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');

          // 1) ReforcoFila: preserva toda a fila diaria e remove somente o
          // seletor antigo do Plano, hoje substituido pelo controller V5.
          {
            const p='src/js/54-reforco-fila.js';
            let s=fs.readFileSync(p,'utf8');
            const ini='/* ── PUXAR DO PLANO: ciclo de slots, matéria primeiro, tópico depois ───── */';
            const fim='window.ReforcoFila = ReforcoFila;';
            const a=s.indexOf(ini), b=s.indexOf(fim);
            if(a>=0){
              if(!(b>a)) throw new Error('export ReforcoFila nao encontrado apos bloco legado');
              const nota='/* A selecao de sugestoes do Plano pertence ao PlanoSugestoesV5.\n   Esta camada fica restrita a agenda diaria, saldo, parcial e reagendamento. */\n';
              s=s.slice(0,a)+nota+s.slice(b);
              fs.writeFileSync(p,s);
            } else if(/prepararSugestoesPlano|selecionarSugestoesPlano|decorarSugestoesPlano/.test(s)) {
              throw new Error('marcador do bloco legado mudou, mas funcoes antigas continuam presentes');
            }
          }

          // 2) Lei seca: mantem o cache do Plano usado pela avaliacao da fila,
          // mas remove o override de ranking que so servia ao seletor aposentado.
          {
            const p='src/js/56-leis-rodizio.js';
            let s=fs.readFileSync(p,'utf8');
            const ini="  if (typeof ReforcoFila !== 'undefined') {";
            const fim='\n\n  const LeiRodizio = {';
            const a=s.indexOf(ini), b=s.indexOf(fim,a);
            if(a>=0){
              if(!(b>a)) throw new Error('fim do bloco ReforcoFila em leis-rodizio nao encontrado');
              const atual=`  if (typeof ReforcoFila !== 'undefined') {\n    ReforcoFila._planoRef = function () {\n      try { return PlanFastCache.atual(); }\n      catch (e) { _quiet(e, 'fila-plano-ref-fast'); return null; }\n    };\n  }`;
              s=s.slice(0,a)+atual+s.slice(b);
              fs.writeFileSync(p,s);
            } else if(/_rankDisciplinasPlano/.test(s)) {
              throw new Error('override legado de ranking ainda presente sem marcador esperado');
            }
          }

          // 3) Mantem no teste de fila apenas os cenarios da responsabilidade
          // atual: agenda, densidade, blocos, parcial, conclusao e migracao.
          {
            const p='testes/reforco-fila.mjs';
            let s=fs.readFileSync(p,'utf8');
            const marco="console.log('OK: fila diária do reforço preserva ciclo, rodízio, criticidade e saldo.');";
            const i=s.indexOf(marco);
            if(i<0) throw new Error('marco de corte de reforco-fila.mjs nao encontrado');
            const fim=i+marco.length;
            if(/Seleção do Plano|selecionarSugestoesPlano|_planoBind/.test(s.slice(fim))) {
              s=s.slice(0,fim)+'\n';
              fs.writeFileSync(p,s);
            }
          }

          // 4) O teste integrado antigo era majoritariamente do seletor
          // aposentado e duplicava as invariantes de fila ja cobertas acima.
          if(fs.existsSync('testes/reforco-cenarios.mjs')) fs.unlinkSync('testes/reforco-cenarios.mjs');

          // 5) Retira o teste apagado da CI.
          {
            const p='.github/workflows/verificar.yml';
            let s=fs.readFileSync(p,'utf8');
            const trecho="      - name: Validar cenarios integrados de reforco\n        run: node testes/reforco-cenarios.mjs\n";
            if(s.includes(trecho)){
              s=s.replace(trecho,'');
              fs.writeFileSync(p,s);
            } else if(/reforco-cenarios\.mjs/.test(s)) throw new Error('referencia a reforco-cenarios mudou de formato');
          }

          // 6) A auditoria de higiene passa a impedir o retorno do seletor
          // antigo como codigo executavel.
          {
            const p='testes/repositorio-higiene.mjs';
            let s=fs.readFileSync(p,'utf8');
            const alvo="  assert.equal(/_legacyPuxar\\b/.test(codigo),false,`fallback para Puxar do Plano legado não pode voltar: ${relative(ROOT,f)}`);";
            const extra="\n  for(const nome of ['prepararSugestoesPlano','selecionarSugestoesPlano','decorarSugestoesPlano','configSugestoesPlano','filtrarCandidatosPlano','_rankDisciplinasPlano']) assert.equal(new RegExp(`\\\\b${nome}\\\\b`).test(codigo),false,`seletor legado do Plano não pode voltar: ${relative(ROOT,f)} → ${nome}`);";
            if(s.includes(alvo)&&!s.includes('seletor legado do Plano não pode voltar')){
              s=s.replace(alvo,alvo+extra);
              fs.writeFileSync(p,s);
            }
          }
          NODE

          node --check src/js/54-reforco-fila.js
          node --check src/js/56-leis-rodizio.js
          node --check testes/reforco-fila.mjs
          node testes/repositorio-higiene.mjs
          node testes/reforco-fila.mjs
          node testes/lei-rodizio-perf.mjs

          git rm .github/workflows/higiene-legado-plano-temporaria.yml
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/js/54-reforco-fila.js src/js/56-leis-rodizio.js testes/reforco-fila.mjs testes/repositorio-higiene.mjs .github/workflows/verificar.yml
          git add -u testes/reforco-cenarios.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: remove seletor legado do Plano da fila diaria'
          git push origin HEAD:chore/main-hygiene-audit-v1
