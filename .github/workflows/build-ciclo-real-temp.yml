name: Build ciclo real temporario
on:
  push:
    branches:
      - fix/plano-ciclos-rotacao-real
    paths:
      - testes/atividades-extras.mjs
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plano-ciclos-rotacao-real
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Montar artefatos
        run: |
          node --check src/js/51a-tec-scope-consistency.js
          node testes/atividades-extras.mjs
          node build.mjs
          node build.mjs --check
      - name: Gravar artefatos gerados
        run: |
          git config user.name StudyNoMentor
          git config user.email jairo258@hotmail.com
          git add index.html src/manifesto.json sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gera build do ciclo realista do Plano"
          git push origin HEAD:fix/plano-ciclos-rotacao-real
