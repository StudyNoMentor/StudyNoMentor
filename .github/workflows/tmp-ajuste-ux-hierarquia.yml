name: Ajuste temporario UX hierarquia

on:
  push:
    branches: [refactor/ux-hierarquia-fluxos-v1]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ux-hierarquia-fluxos-v1
      - name: Preservar porta compacta dos ajustes analiticos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/js/93-ux-hierarquia.js')
          s = p.read_text()
          old = """      const oldCfg = q('#tec-panel-plano .tec-cfg-bar', s);\n      if (oldCfg) { oldCfg.hidden = true; oldCfg.setAttribute('aria-hidden', 'true'); }"""
          new = """      const oldCfg = q('#tec-panel-plano .tec-cfg-bar', s);\n      if (oldCfg) {\n        // A folha ainda reúne ajustes analíticos válidos. Mantemos UMA porta compacta,\n        // sem devolver à superfície os modos/ordenadores legados de decisão.\n        oldCfg.hidden = false;\n        oldCfg.removeAttribute('aria-hidden');\n        oldCfg.classList.add('ux-analysis-settings');\n        const abrirAjustes = q('.tec-cfg-open', oldCfg);\n        if (abrirAjustes) {\n          abrirAjustes.innerHTML = '<span class=\"gg-ic\">⚙</span>Ajustes da análise';\n          abrirAjustes.title = 'Ajustar métricas analíticas sem alterar o motor das sugestões';\n        }\n      }"""
          if old not in s:
              raise SystemExit('bloco oldCfg nao encontrado')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/css/27-ux-hierarquia.css')
          s = p.read_text()
          anchor = "#screen-desempenhotec #plano-modos[hidden],#screen-desempenhotec #plano-modo-nota[hidden],#screen-desempenhotec #tec-panel-plano .tec-cfg-bar[hidden]{display:none!important}\n"
          repl = "#screen-desempenhotec #plano-modos[hidden],#screen-desempenhotec #plano-modo-nota[hidden]{display:none!important}\n#screen-desempenhotec .tec-cfg-bar.ux-analysis-settings{opacity:.78;margin-bottom:10px}\n#screen-desempenhotec .tec-cfg-bar.ux-analysis-settings:hover,#screen-desempenhotec .tec-cfg-bar.ux-analysis-settings:focus-within{opacity:1}\n"
          if anchor not in s:
              raise SystemExit('regra CSS da barra nao encontrada')
          p.write_text(s.replace(anchor, repl, 1))

          p = Path('testes/ux-hierarquia-browser.mjs')
          s = p.read_text()
          s = s.replace("oldCfgHidden:document.querySelector('#tec-panel-plano .tec-cfg-bar')?.hidden!==false,", "oldCfgVisible:document.querySelector('#tec-panel-plano .tec-cfg-bar')?.hidden===false,")
          s = s.replace("ok(tec.modosHidden&&tec.notaHidden&&tec.oldCfgHidden,'decisores legados do Plano não devem disputar com Simplificado/Robusto');", "ok(tec.modosHidden&&tec.notaHidden,'decisores legados do Plano não devem disputar com Simplificado/Robusto');\n  ok(tec.oldCfgVisible,'ajustes analíticos válidos devem manter uma porta compacta e focável');")
          p.write_text(s)
          PY
          node --check src/js/93-ux-hierarquia.js
          node --check testes/ux-hierarquia-browser.mjs
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/js/93-ux-hierarquia.js src/css/27-ux-hierarquia.css testes/ux-hierarquia-browser.mjs
          git commit -m 'fix: preserva acesso aos ajustes analiticos do TEC'
          git push origin HEAD:refactor/ux-hierarquia-fluxos-v1
