name: Debug verificar scope

on:
  push:
    branches: [fix/tec-scope-plano-completo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tec-scope-plano-completo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capturar saída completa
        run: |
          set +e
          node verificar.mjs > verificar-debug.log 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> verificar-debug.log
          cat verificar-debug.log
          exit 0
      - name: Publicar diagnóstico na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verificar-debug.log
          git commit -m "Captura diagnóstico temporário da verificação [skip ci]" || exit 0
          git push origin HEAD:fix/tec-scope-plano-completo
