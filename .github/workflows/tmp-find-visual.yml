name: TEMP Find Visual Sources

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Localizar microtextos restantes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TEXTO ==='
          grep -RniE 'retratos no escopo|retratos salvos|última medição|parâmetros auditados|DIRETO|ESTATÍSTICO|lei\(s\) apta\(s\)|reforço.*s' src || true
          echo '=== FONT-SIZE 9PX / IMPORTANT EM JS ==='
          grep -RniE 'font-size[^;]*9px|setProperty\([^)]*font-size|fontSize' src/js | head -n 250 || true
