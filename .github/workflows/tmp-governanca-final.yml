name: Validar governança final
on:
  push:
    branches:
      - feat/lei-seca-rodizio-perf-extras
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Testes de governança e regressões focais
        run: |
          node testes/governanca-rebalanceamento.mjs
          node testes/governanca-premium.mjs
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
          node build.mjs --check
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Suíte canônica completa
        run: node verificar.mjs
      - name: Limpar workflow temporário
        run: |
          rm -f .github/workflows/tmp-governanca-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: valida governança seletiva e limpa CI temporária"
          git push
