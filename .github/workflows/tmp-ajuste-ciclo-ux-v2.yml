name: Ajuste Ciclo UX V2

on:
  push:
    branches: [refactor/ux-hierarquia-visual-v2]

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ux-hierarquia-visual-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preservar alturas distintas dos KPIs do Ciclo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/css/27-ux-hierarquia.css')
          s=p.read_text()
          marker='/* UX V2: a grade do Ciclo não estica indicadores derivados até a altura dos prioritários. */\n'
          rule='#ciclo-overview-gauges.ux-week-gauges{align-items:start}\n#ciclo-overview-gauges .mini-gauge-card{align-self:start}\n'
          if marker not in s:
              s += '\n'+marker+rule
          p.write_text(s)
          PY
          rm .github/workflows/tmp-ajuste-ciclo-ux-v2.yml
          node build.mjs
          node testes/repositorio-higiene.mjs
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/css/27-ux-hierarquia.css .github/workflows/tmp-ajuste-ciclo-ux-v2.yml index.html sw.js src/manifesto.json
          git commit -m 'fix: diferencia altura dos KPIs prioritarios do Ciclo'
          git push origin HEAD:refactor/ux-hierarquia-visual-v2
