name: TMP Extras UX100

on:
  push:
    branches: [feat/extras-ux-auditoria-100-camadas]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar patch estrutural idempotente
        run: python .github/patch-extras-ux100.py

      - name: Montar produto publicado
        run: |
          node --check src/js/59-extras-ux100.js
          node build.mjs
          node build.mjs --check

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Auditar 100+ invariantes e gerar imagens
        env:
          EXTRAS_UX_SHOTS: '1'
        run: node testes/extras-ux100-browser.mjs

      - name: Regressao estatistica do reforco adaptativo
        run: node testes/reforco-adaptativo-massivo.mjs

      - name: Regressao estrutural de Extras
        run: node testes/extras-estabilidade.mjs

      - name: Validar estabilidade mobile e modais
        run: node testes/extras-estabilidade-browser.mjs

      - name: Validar interacoes Extras e Plano TEC
        run: node testes/extras-tec-interacoes-browser.mjs

      - name: Auditar performance global
        run: node testes/site-performance-browser.mjs

      - name: Rodar suite canonica completa
        run: node verificar.mjs

      - name: Publicar capturas da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extras-ux100-screenshots-${{ github.run_id }}
          path: .artifacts/extras-ux100
          if-no-files-found: ignore
          retention-days: 14

      - name: Persistir produto validado na branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.mjs src/js/55-extras-ui-moderna.js src/css/09-extras-v51.css src/css/18-extras-ux100.css .github/workflows/verificar.yml testes/extras-ux100-browser.mjs index.html src/manifesto.json sw.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao gerada para persistir.'
          else
            git commit -m 'feat: consolida hierarquia e UX do menu Extras'
            git push origin HEAD:feat/extras-ux-auditoria-100-camadas
          fi
