name: Fix Extras browser test

on:
  push:
    branches: [audit/atividades-extras-profissional]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/atividades-extras-profissional
          fetch-depth: 0
      - name: Corrigir teste de minutos
        run: python3 scripts/fix-extras-test.py
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verificar.mjs
          git commit -m "Corrige teste real de minutos nas Atividades [skip ci]"
          git push origin HEAD:audit/atividades-extras-profissional