name: Validar hardening final de Extras
on:
  push:
    branches: [fix/extras-layout-hardening-final]
permissions:
  contents: write
jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Corrigir handlers e sonda de performance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/js/59-extras-stability.js')
          s=p.read_text()
          old='catch(_){}'
          n=s.count(old)
          if n != 2:
              raise SystemExit(f'esperava 2 catch vazios de foco, encontrei {n}')
          s=s.replace(old,"catch(e){if(typeof _quiet==='function')_quiet(e,'extras-overlay-focus');}")
          p.write_text(s)

          t=Path('testes/tec-plano-performance-browser.mjs')
          q=t.read_text()
          oldq="window.switchScreen&&window.DesempenhoTecScreen&&window.PlanoEngine&&window.ReforcoAdaptativo"
          newq="typeof switchScreen==='function'&&typeof DesempenhoTecScreen==='object'&&typeof PlanoEngine==='object'&&typeof ReforcoAdaptativo==='object'"
          if oldq not in q:
              raise SystemExit('pre-condicao antiga da sonda do Plano nao encontrada')
          t.write_text(q.replace(oldq,newq,1))
          PY
      - name: Sintaxe e build
        run: |
          node --check src/js/59-extras-stability.js
          node --check testes/tec-plano-performance-browser.mjs
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias
        run: npm ci
      - name: Simular prescricao adaptativa
        run: node testes/reforco-adaptativo-massivo.mjs
      - name: Validar estabilidade estrutural
        run: node testes/extras-estabilidade.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Auditar Extras desktop e mobile
        run: node testes/extras-estabilidade-browser.mjs
      - name: Auditar fluidez Desempenho TEC para Plano
        run: node testes/tec-plano-performance-browser.mjs
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir produto aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/js/59-extras-stability.js testes/tec-plano-performance-browser.mjs index.html src/manifesto.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'build: aprova hardening de Extras e fluidez do Plano'
          git push origin HEAD:fix/extras-layout-hardening-final
