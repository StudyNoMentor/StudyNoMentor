name: TMP V3 Test Fix
on:
  push:
    branches: [feat/extras-leis-tec-startup-auditoria-v3]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar ajuste e checar sintaxe
        run: |
          set -euo pipefail
          python .github/patch-tec-test-v3.py
          node --check testes/tec-ux100-browser.mjs
          git diff --check
      - name: Persistir teste
        run: |
          set -euo pipefail
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add testes/tec-ux100-browser.mjs
          git commit -m 'test: respeita Proximas recolhido no TEC [skip ci]'
          git push
