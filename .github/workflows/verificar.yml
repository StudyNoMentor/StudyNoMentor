# Barreira de qualidade: nada entra no main sem passar por aqui.
# Protege build, motores, Extras, TEC, performance, acessibilidade e higiene do repositorio.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sincronizar-gerados:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      alterou: ${{ steps.sync.outputs.alterou }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar build derivado
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          for f in src/js/*.js testes/*.mjs; do node --check "$f"; done
          node build.mjs
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            echo 'alterou=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js src/manifesto.json
          git commit -m 'build: sincroniza artefatos gerados'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'alterou=true' >> "$GITHUB_OUTPUT"

  verificar:
    needs: [sincronizar-gerados]
    if: ${{ always() && (needs.sincronizar-gerados.result == 'skipped' || needs.sincronizar-gerados.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight rapido
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check verificar.mjs
          for f in src/js/*.js testes/*.mjs; do node --check "$f"; done
          node build.mjs
          git diff --exit-code -- index.html sw.js src/manifesto.json
      - name: Auditar higiene do repositorio
        run: node testes/repositorio-higiene.mjs
      - name: Instalar dependencias de teste
        run: npm ci
      - name: Simular prescricao adaptativa independente
        run: node testes/reforco-adaptativo-massivo.mjs
      - name: Validar motores de sugestao independentes
        run: node testes/plano-sugestoes-modulos.mjs
      - name: Validar motor Robusto TEC + Extras
        run: node testes/plano-robusto.mjs
      - name: Auditar residuos do Robusto antigo
        run: node testes/plano-robusto-higiene.mjs
      - name: Validar log auditavel observacional do Robusto
        run: node testes/plano-robusto-audit-log.mjs
      - name: Validar governanca global dos motores do Plano
        run: node testes/plano-motores-governanca.mjs
      - name: Validar estabilidade estrutural de Extras
        run: node testes/extras-estabilidade.mjs
      - name: Validar contratos premium de governanca
        run: node testes/governanca-premium.mjs
      - name: Validar rebalanceamento seletivo de reforcos
        run: node testes/governanca-rebalanceamento.mjs
      - name: Validar rodizio e cache de lei seca
        run: node testes/lei-rodizio-perf.mjs
      - name: Validar fila diaria de reforco
        run: node testes/reforco-fila.mjs
      - name: Validar modulo separado da Integracao TEC
        run: node testes/tec-integracao-modulo.mjs
      - name: Validar gatilho resiliente do Companion
        run: node testes/tec-companion-gatilho.mjs
      - name: Validar ChatGPT Plus sem API no Companion
        run: node testes/tec-companion-plus.mjs
      - name: Validar workbench TEC e evidencia real
        run: node testes/tec-workbench-reforco-real.mjs
      - name: Validar organizacao estrutural de Extras e TEC
        run: node testes/ui-organizacao-extras-tec.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validar Puxar do Plano multimotor
        run: timeout 90s node testes/plano-sugestoes-modulos-browser.mjs
      - name: Validar governanca dos motores no navegador
        run: timeout 90s node testes/plano-motores-governanca-browser.mjs
      - name: Validar central dos motores no Desempenho TEC
        run: timeout 90s node testes/plano-motores-central-tec-browser.mjs
      - name: Validar fonte das sugestoes na abertura e no Plano TEC
        run: timeout 90s node testes/tec-plano-fonte-motor-browser.mjs
      - name: Validar ponte incorporada da Integracao TEC
        run: timeout 90s node testes/tec-integracao-browser.mjs
      - name: Auditar startup, loaders e continuidade adaptativa
        run: node testes/startup-reforco-browser.mjs
      - name: Auditar performance do site inteiro
        run: node testes/site-performance-browser.mjs
      - name: Validar modais e ativacao adaptativa no navegador
        run: node testes/extras-estabilidade-browser.mjs
      - name: Auditar UX completa de Extras
        run: node testes/extras-ux100-browser.mjs
      - name: Auditar governanca do Desempenho TEC
        run: node testes/tec-ux100-browser.mjs
      - name: Validar fluidez do Plano TEC
        run: node testes/tec-plano-performance-browser.mjs
      - name: Auditar interacoes de Extras e Plano TEC
        run: node testes/extras-tec-interacoes-browser.mjs
      - name: Auditar estabilidade visual
        run: node testes/ux-stability-browser.mjs
      - name: Auditar hierarquia e fluidez global
        run: node testes/ux-hierarquia-browser.mjs
      - name: Verificar
        run: node verificar.mjs
