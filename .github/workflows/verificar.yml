# Barreira de qualidade: nada entra no main sem passar por aqui.
#
# O que ela impede, na pratica:
#   · index.html e src/ sairem de sincronia (alguem edita um e esquece o outro);
#   · um modulo de src/js com erro de sintaxe;
#   · o agendador divergir do Anki (21 mil pontos contra fsrs-rs + rslib);
#   · id duplicado ou tag estrutural desbalanceada no HTML publicado;
#   · o app quebrar no carregamento ou alguma das 14 telas lancar erro;
#   · a suite AutoTeste (FSRS, fuzz, agendador, parser TEC...) regredir;
#   · o reforco adaptativo produzir dose ou parada estatisticamente invalida;
#   · modais de Extras voltarem a se sobrepor ou a ativacao adaptativa travar;
#   · Desempenho TEC -> Plano voltar a congelar em perfis grandes;
#   · interacoes de Extras/Plano deixarem rotulos transitórios presos nos botoes;
#   · o botao "Opcoes" da Grade voltar a vazar do cabecalho.
name: Verificacao

on:
  # Branches de feature sao verificadas pelo evento pull_request. Rodar tambem
  # no push dessas mesmas branches duplicava jobs, consumo e notificacoes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um novo commit no mesmo PR torna a execucao anterior obsoleta. Cancela-la
# reduz ruido de CI sem enfraquecer a barreira de qualidade do SHA mais recente.
concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # As dependencias de teste do repositorio. Sem este passo, node_modules
      # so tem o Playwright instalado abaixo — e a checagem 6.7 (o caminho da
      # nuvem inteiro contra um PostgREST de mentira, incluindo o token
      # recusado por deriva de relogio) era PULADA em toda execucao da CI por
      # falta do supabase-js, sem que ninguem percebesse: ela imprime "PULADA"
      # e o job segue verde.
      - name: Instalar dependencias de teste
        run: npm ci

      # Barreira estatistica do motor de dose adaptativa. O teste inclui casos
      # dirigidos, 20 mil prescricoes aleatorias e 8 mil cenarios Monte Carlo.
      # O recurso nasce opt-in: a simulacao o ativa explicitamente para testar
      # o motor sem alterar o contrato classico das atividades existentes.
      - name: Simular prescricao adaptativa
        run: node testes/reforco-adaptativo-massivo.mjs

      # Regressao barata e estrutural: impede O(n²) no decorador do Plano,
      # garante pilha de overlays e protege o viewport mobile antes do navegador.
      - name: Validar estabilidade estrutural de Extras
        run: node testes/extras-estabilidade.mjs

      # Playwright so e usado pelas checagens com app real no Chromium.
      # A versao e fixada aqui porque o navegador baixado tem de casar com ela.
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Reproduz o bug que motivou a correcao: Central -> Reforcos -> Adaptativo,
      # ativa e salva em viewport mobile, cobrando camada, tempo e zero render do
      # TEC escondido. Se voltar a travar ou abrir atras, o PR falha aqui.
      - name: Validar modais e ativacao adaptativa no navegador
        run: node testes/extras-estabilidade-browser.mjs

      # Perfil sintetico propositalmente grande: 10 materias, 1.000 topicos e
      # 8 retratos. Cobra resposta imediata do clique, primeira abertura e
      # reabertura do Plano para impedir a volta de congelamentos de varios segundos.
      - name: Validar fluidez do Plano TEC
        run: node testes/tec-plano-performance-browser.mjs

      # Varre os controles interativos reais de Extras e Plano em desktop/mobile,
      # inclusive o ciclo Concluir -> Reabrir, impedindo rótulo de processamento
      # preso, botão sem nome acessível, overflow e regressões de feedback visual.
      - name: Auditar interacoes de Extras e Plano TEC
        run: node testes/extras-tec-interacoes-browser.mjs

      - name: Verificar
        run: node verificar.mjs
