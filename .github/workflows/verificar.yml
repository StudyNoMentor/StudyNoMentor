# Gate minimo de PR: apenas o necessario para impedir merge quebrado.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.13'

      - name: Build e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check verificar.mjs
          for f in src/js/*.js; do node --check "$f"; done
          node build.mjs

      - name: Egress Supabase
        if: github.event_name != 'push'
        run: timeout 30s node testes/supabase-egress.mjs

      - name: Pausa de planejamento
        if: github.event_name != 'push'
        run: timeout 30s node testes/planning-pause.mjs

      - name: Listas flutuantes mobile
        if: github.event_name != 'push'
        run: timeout 30s node testes/floating-lists.mjs

      - name: Contrato central dos Cards
        if: github.event_name != 'push'
        run: timeout 120s node testes/cards-paridade-total-anki.mjs

      - name: Escopo global e motor pós-edital
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s node testes/global-scope-cards.mjs
          timeout 30s node testes/motor-sugestao-regra.mjs
          timeout 30s node testes/grade-gerador.mjs

      - name: Exportação de pacotes
        if: github.event_name != 'push'
        env:
          SNM_APKG_LEGACY_OUT: ${{ runner.temp }}/snm-study-legacy.apkg
          SNM_APKG_LATEST_OUT: ${{ runner.temp }}/snm-study-latest.apkg
          SNM_COLPKG_OUT: ${{ runner.temp }}/snm-study.colpkg
        run: timeout 120s node testes/cards-apkg-export.mjs

      - name: Importação de formatos
        if: github.event_name != 'push'
        run: timeout 120s node testes/cards-import-formatos.mjs

      - name: Runtime Anki
        if: github.event_name != 'push'
        run: timeout 120s node testes/cards-runtime-anki.mjs

      - name: Concorrência multidevice
        if: github.event_name != 'push'
        run: timeout 120s node testes/cards-concorrencia-multidevice.mjs

      - name: FSRS oficial (otimizador, Health Check, simulador)
        if: github.event_name != 'push'
        run: timeout 180s node testes/cards-fsrs-optimizer-oficial.mjs

      - name: Round-trip com Anki oficial 26.09.2
        if: github.event_name != 'push'
        shell: bash
        env:
          SNM_APKG_LEGACY_OUT: ${{ runner.temp }}/snm-study-legacy.apkg
          SNM_APKG_LATEST_OUT: ${{ runner.temp }}/snm-study-latest.apkg
          SNM_ANKI_OFFICIAL_OUT: ${{ runner.temp }}/anki-oficial-latest.apkg
          SNM_ANKI_SEARCH_EXPECTED: ${{ runner.temp }}/anki-search-expected.json
          SNM_ANKI_TYPEANSWER_EXPECTED: ${{ runner.temp }}/anki-typeanswer-expected.json
        run: |
          set -euo pipefail
          timeout 180s python -m pip install --disable-pip-version-check --quiet --timeout 30 --retries 2 'anki==26.09.2'
          timeout 120s python testes/anki-oficial-roundtrip.py
          timeout 120s python testes/anki-oficial-search.py
          timeout 120s node testes/cards-search-differential.mjs
          timeout 120s python testes/anki-oficial-typeanswer.py
          timeout 120s node testes/cards-typeanswer-differential.mjs
          timeout 120s node testes/cards-import-anki-oficial.mjs

      - name: Backend Anki Oficial
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python -m pip install --disable-pip-version-check --quiet --timeout 30 --retries 2 -r anki_official_backend/requirements.txt
          ANKI_DATA_DIR="${RUNNER_TEMP}/anki-official" timeout 120s python testes/anki-oficial-backend-smoke.py

      - name: Regressões críticas dos Cards
        if: github.event_name != 'push'
        run: timeout 120s node audit/cards-20260921-v2/regressao.mjs

      - name: Sincronizar artefatos gerados na main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: sincronizar artefatos gerados [skip ci]"
          git push

  suites:
    # Suítes completas: todo testes/*.mjs participa de uma barreira automática
    # (repositorio-higiene.mjs exige). Job próprio para não estourar o gate mínimo.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node build.mjs

      - name: Suítes Node
        shell: bash
        run: |
          set -euo pipefail
          for t in testes/repositorio-higiene.mjs testes/cards-10of10-final.mjs testes/cards-image-occlusion.mjs \
                   testes/cards-max-editor-io.mjs testes/cards-max-stats-media.mjs testes/cards-practical-10.mjs \
                   testes/cards-product-parity.mjs testes/cards-total-parity.mjs testes/extras-estabilidade.mjs \
                   testes/governanca-premium.mjs testes/governanca-rebalanceamento.mjs testes/lei-rodizio-perf.mjs \
                   testes/reforco-fila.mjs testes/ui-organizacao-extras-tec.mjs; do
            echo "::group::$t"; timeout 120s node "$t"; echo "::endgroup::"
          done
          # Longo prazo: 6.000 cards × 365 dias com fila e agendador reais.
          timeout 600s node testes/cards-certificacao-anki.mjs

      - name: Suítes de navegador
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # A lista explícita também é o que repositorio-higiene.mjs confere.
          for t in testes/cards-max-reviewer-browser.mjs testes/cards-foco-edicao-browser.mjs testes/cards-estatisticas-layout-browser.mjs testes/cards-reparo-memoria-browser.mjs testes/cards-multi-planejamento-browser.mjs testes/grade-gerador-browser.mjs testes/telas-estudo-browser.mjs testes/extras-estabilidade-browser.mjs \
                   testes/extras-ux100-browser.mjs testes/site-performance-browser.mjs \
                   testes/startup-reforco-browser.mjs testes/ux-hierarquia-browser.mjs \
                   testes/ux-stability-browser.mjs; do
            echo "::group::$t"; timeout 300s node "$t"; echo "::endgroup::"
          done
