# Gate minimo de PR: apenas o necessario para impedir merge quebrado.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.13'

      - name: Build e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check verificar.mjs
          for f in src/js/*.js; do node --check "$f"; done
          node build.mjs

      - name: Contrato central dos Cards
        if: github.event_name != 'push'
        run: node testes/cards-paridade-total-anki.mjs

      - name: Interoperabilidade dos Cards
        if: github.event_name != 'push'
        shell: bash
        env:
          SNM_APKG_LEGACY_OUT: ${{ runner.temp }}/snm-study-legacy.apkg
          SNM_APKG_LATEST_OUT: ${{ runner.temp }}/snm-study-latest.apkg
          SNM_COLPKG_OUT: ${{ runner.temp }}/snm-study.colpkg
        run: |
          set -euo pipefail
          node testes/cards-apkg-export.mjs
          node testes/cards-import-formatos.mjs
          node testes/cards-runtime-anki.mjs
          node testes/cards-product-parity.mjs
          node testes/cards-max-reviewer-browser.mjs
          node testes/cards-image-occlusion.mjs
          node testes/cards-max-editor-io.mjs
          node testes/cards-max-stats-media.mjs
          node testes/cards-10of10-final.mjs
          node testes/cards-total-parity.mjs
          node testes/cards-practical-10.mjs
          node testes/cards-fsrs-optimizer-oficial.mjs
          node testes/cards-concorrencia-multidevice.mjs

      - name: Round-trip com Anki oficial 26.09.2
        if: github.event_name != 'push'
        shell: bash
        env:
          SNM_APKG_LEGACY_OUT: ${{ runner.temp }}/snm-study-legacy.apkg
          SNM_APKG_LATEST_OUT: ${{ runner.temp }}/snm-study-latest.apkg
          SNM_ANKI_OFFICIAL_OUT: ${{ runner.temp }}/anki-oficial-latest.apkg
          SNM_ANKI_SEARCH_EXPECTED: ${{ runner.temp }}/anki-search-expected.json
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'anki==26.09.2'
          python testes/anki-oficial-roundtrip.py
          python testes/anki-oficial-search.py
          node testes/cards-search-differential.mjs
          node testes/cards-import-anki-oficial.mjs

      - name: Regressões críticas dos Cards
        if: github.event_name != 'push'
        run: node audit/cards-20260921-v2/regressao.mjs

      - name: Certificação longitudinal — 6.000 cards por 365 dias
        if: github.event_name != 'push'
        run: node testes/cards-certificacao-anki.mjs

      - name: Sincronizar artefatos gerados na main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: sincronizar artefatos gerados [skip ci]"
          git push
