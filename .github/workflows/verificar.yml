# Gate minimo de PR: apenas o necessario para impedir merge quebrado.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          for f in src/js/*.js; do node --check "$f"; done
          node build.mjs

      - name: Contrato central dos Cards
        if: github.event_name != 'push'
        run: node testes/cards-paridade-total-anki.mjs

      - name: Interoperabilidade dos Cards
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          node testes/cards-apkg-export.mjs
          node testes/cards-import-formatos.mjs
          node testes/cards-concorrencia-multidevice.mjs

      - name: Sincronizar artefatos gerados na main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: sincronizar artefatos gerados [skip ci]"
          git push
