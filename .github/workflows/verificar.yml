# Barreira de qualidade rápida e completa.
# Estratégia: sincroniza artefatos uma vez; depois divide a suíte em jobs
# paralelos. A cobertura continua integral, mas o tempo de parede cai bastante.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sincronizar-gerados:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      alterou: ${{ steps.sync.outputs.alterou }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar build derivado
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          for f in src/js/*.js companion/src/*.js testes/*.mjs; do node --check "$f"; done
          node build.mjs
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            echo 'alterou=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js src/manifesto.json
          git commit -m 'build: sincroniza artefatos gerados'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'alterou=true' >> "$GITHUB_OUTPUT"

  preflight:
    needs: [sincronizar-gerados]
    if: ${{ always() && (needs.sincronizar-gerados.result == 'skipped' || needs.sincronizar-gerados.result == 'success') && needs.sincronizar-gerados.outputs.alterou != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sintaxe, build e higiene
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check verificar.mjs
          for f in src/js/*.js companion/src/*.js testes/*.mjs; do node --check "$f"; done
          node build.mjs
          git diff --exit-code -- index.html sw.js src/manifesto.json
          node testes/repositorio-higiene.mjs

  unit-core:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Contratos centrais e motores
        shell: bash
        run: |
          set -euo pipefail
          node testes/paridade-anki.mjs
          node testes/robustez-config.mjs
          node testes/fidelidade-tec.mjs
          node testes/startup-hot-hydration.mjs
          node testes/reforco-adaptativo-massivo.mjs
          node testes/plano-sugestoes-modulos.mjs
          node testes/plano-robusto.mjs
          node testes/plano-robusto-higiene.mjs
          node testes/plano-robusto-audit-log.mjs
          node testes/plano-motores-governanca.mjs
          node testes/extras-estabilidade.mjs
          node testes/governanca-premium.mjs
          node testes/governanca-rebalanceamento.mjs
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs

  unit-tec:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Integridade, reconstrução e gestão TEC
        shell: bash
        run: |
          set -euo pipefail
          node testes/tec-integridade-profunda.mjs
          node testes/tec-integracao-modulo.mjs
          node testes/tec-reconstrucao-caderno.mjs
          node testes/tec-reconstrucao-duravel.mjs
          node testes/tec-historico-gestao.mjs
          node testes/tec-integracao-hardening-total.mjs
          node testes/tec-companion-gatilho.mjs
          node testes/tec-companion-watchdog.mjs
          node testes/tec-companion-plus.mjs
          node testes/startup-sem-refresh-loop.mjs
          node testes/tec-workbench-reforco-real.mjs
          node testes/tec-lacunas-continuas.mjs
          node testes/tec-lacunas-continuas-logica.mjs
          node testes/tec-ux-foco-total.mjs
          node testes/tec-cloud-cross-device.mjs
          node testes/ui-organizacao-extras-tec.mjs

  browser:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Preparar Chromium da versão travada no package-lock
        run: npx playwright install --with-deps chromium
      - name: Regressões reais no navegador
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s node testes/startup-hot-hydration-browser.mjs
          timeout 90s node testes/plano-sugestoes-modulos-browser.mjs
          timeout 90s node testes/plano-motores-governanca-browser.mjs
          timeout 90s node testes/plano-motores-central-tec-browser.mjs
          timeout 90s node testes/tec-plano-fonte-motor-browser.mjs
          timeout 90s node testes/tec-integracao-browser.mjs
          timeout 90s node testes/startup-reforco-browser.mjs
          timeout 90s node testes/site-performance-browser.mjs
          timeout 90s node testes/extras-estabilidade-browser.mjs
          timeout 90s node testes/extras-ux100-browser.mjs
          timeout 90s node testes/tec-ux100-browser.mjs
          timeout 90s node testes/tec-plano-performance-browser.mjs
          timeout 90s node testes/extras-tec-interacoes-browser.mjs
          timeout 90s node testes/ux-stability-browser.mjs
          timeout 90s node testes/ux-hierarquia-browser.mjs

  verificador-final:
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Verificador integral, AutoTeste e WCAG
        run: node verificar.mjs

  gate:
    needs: [unit-core, unit-tec, browser, verificador-final]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Todos os gates precisam estar verdes
        shell: bash
        run: |
          test "${{ needs.unit-core.result }}" = success
          test "${{ needs.unit-tec.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.verificador-final.result }}" = success
