# Barreira de qualidade: nada entra no main sem passar por aqui.
#
# O que ela impede, na pratica:
#   · index.html e src/ sairem de sincronia (alguem edita um e esquece o outro);
#   · um modulo de src/js com erro de sintaxe;
#   · o agendador divergir do Anki (21 mil pontos contra fsrs-rs + rslib);
#   · id duplicado ou tag estrutural desbalanceada no HTML publicado;
#   · o app quebrar no carregamento ou alguma das 14 telas lancar erro;
#   · a suite AutoTeste (FSRS, fuzz, agendador, parser TEC...) regredir;
#   · o botao "Opcoes" da Grade voltar a vazar do cabecalho;
#   · Atividades Extras / reforcos perderem saldo, quebrarem o rodizio ou
#     divergirem entre desktop e celular sob carga massiva.
name: Verificacao

# Uma branch de PR nao precisa rodar a mesma suite duas vezes. Antes, TODO push
# em qualquer branch disparava esta verificacao e o evento pull_request disparava
# outra copia do mesmo commit. Alem do custo, cada commit intermediario gerava
# dois jobs e dois caminhos de notificacao. A branch agora e validada pelo PR;
# depois do merge, o main roda uma ultima vez como garantia de publicacao.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Se um novo commit chega ao mesmo PR enquanto a verificacao anterior ainda roda,
# a anterior ficou obsoleta. Cancela-la reduz ruido e garante que a unica CI que
# importa e a do SHA mais novo.
concurrency:
  group: verificar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # As dependencias de teste do repositorio. Sem este passo, node_modules
      # so tem o Playwright instalado abaixo — e a checagem 6.7 (o caminho da
      # nuvem inteiro contra um PostgREST de mentira, incluindo o token
      # recusado por deriva de relogio) era PULADA em toda execucao da CI por
      # falta do supabase-js, sem que ninguem percebesse: ela imprime "PULADA"
      # e o job segue verde.
      - name: Instalar dependencias de teste
        run: npm ci

      # Playwright e usado pelo verificar.mjs e pelo stress de Extras. A versao
      # e fixada aqui porque o navegador baixado tem de casar com ela.
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verificar
        run: node verificar.mjs

      # Mesma aplicacao publicada, aberta em Chromium. Alem de milhares de
      # combinacoes do planejador, cria massa real de TEC/Extras, executa
      # parciais, replaneja, mistura Anki e captura desktop/mobile.
      - name: Stress real de Atividades Extras
        run: node testes/stress-extras-browser.mjs

      # Evidencia visual e relatorio numerico do que foi realmente renderizado.
      # Continua no MESMO job: nao cria uma segunda fonte de e-mails/ruido.
      - name: Guardar evidencias visuais do stress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-extras-${{ github.run_id }}
          path: test-artifacts/stress-extras/
          if-no-files-found: warn
          retention-days: 7
