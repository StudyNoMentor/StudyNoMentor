# Gate minimo de PR: apenas o necessario para impedir merge quebrado.
name: Verificacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # SHA do head (e não o nome da branch): funciona também para PRs de fork,
      # cuja branch não existe neste repositório.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          # Baixa a fonte oficial para o gate comparar todos os blobs e os
          # quatro repositórios internos, todos nos commits oficiais.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fonte literal Anki — inventário integral obrigatório
        run: node testes/cards-anki-upstream-manifest.mjs --require-upstream
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.13'

      - name: Recusar runtime Anki divergente
        if: github.event_name != 'push'
        run: python testes/anki-oficial-version.py

      - name: Build e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          node --check build.mjs
          node --check verificar.mjs
          python testes/anki-production-sync.py
          for f in src/js/*.js; do node --check "$f"; done
          node build.mjs
          # Checagens 1–4 do CONTRIBUINDO (montagem byte a byte, sintaxe por
          # módulo, paridade com o Anki, CSP/ids/trava anti-moldura, SW).
          node build.mjs --check
          timeout 300s node verificar.mjs --rapido

      - name: Fila relacional durável
        run: timeout 60s node testes/fila-duravel.mjs

      - name: Egress Supabase
        if: github.event_name != 'push'
        run: timeout 30s node testes/supabase-egress.mjs

      - name: Pausa de planejamento
        if: github.event_name != 'push'
        run: timeout 30s node testes/planning-pause.mjs

      - name: Listas flutuantes mobile
        if: github.event_name != 'push'
        run: timeout 30s node testes/floating-lists.mjs

      - name: Escopo global e motor pós-edital
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout 30s node testes/global-scope-cards.mjs
          timeout 30s node testes/motor-sugestao-regra.mjs
          timeout 30s node testes/grade-gerador.mjs

      - name: Runtime Anki
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s node testes/cards-runtime-anki.mjs

      - name: Concorrência multidevice
        if: github.event_name != 'push'
        run: timeout 120s node testes/cards-concorrencia-multidevice.mjs

      - name: Backend Anki Oficial
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s python -m pip install --disable-pip-version-check --quiet --timeout 30 --retries 2 -r anki_official_backend/requirements.txt
          ANKI_DATA_DIR="${RUNNER_TEMP}/anki-official" timeout 120s python testes/anki-oficial-backend-smoke.py
          ANKI_DATA_DIR="${RUNNER_TEMP}/anki-review-scope" timeout 120s python testes/cards-review-scope.py

      - name: Sincronizar artefatos gerados na main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: sincronizar artefatos gerados [skip ci]"
          git push

  suites:
    # Suítes completas: todo testes/*.mjs participa de uma barreira automática
    # (repositorio-higiene.mjs exige). Job próprio para não estourar o gate mínimo.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node build.mjs

      - name: Suítes Node
        shell: bash
        run: |
          set -euo pipefail
          for t in testes/repositorio-higiene.mjs testes/cards-image-occlusion.mjs \
                   testes/cards-max-editor-io.mjs testes/extras-estabilidade.mjs \
                   testes/governanca-premium.mjs testes/governanca-rebalanceamento.mjs testes/lei-rodizio-perf.mjs \
                   testes/reforco-fila.mjs testes/ui-organizacao-extras-tec.mjs; do
            echo "::group::$t"; timeout 120s node "$t"; echo "::endgroup::"
          done

      - name: Suítes de navegador
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # A lista explícita também é o que repositorio-higiene.mjs confere.
          # Verificação completa (checagens 5–8: console limpo, navegação,
          # AutoTeste, persistência ponta a ponta e contraste WCAG).
          timeout 900s node verificar.mjs
          browser_failures=0
          for t in testes/auditoria-correcoes-browser.mjs testes/cards-estatisticas-layout-browser.mjs testes/cards-multi-planejamento-browser.mjs testes/grade-gerador-browser.mjs testes/telas-estudo-browser.mjs testes/padrao-visual-browser.mjs testes/pausa-metricas-browser.mjs testes/abertura-browser.mjs testes/extras-estabilidade-browser.mjs \
                   testes/extras-ux100-browser.mjs testes/site-performance-browser.mjs \
                   testes/startup-reforco-browser.mjs testes/ux-hierarquia-browser.mjs \
                   testes/ux-stability-browser.mjs testes/registrar-formulario-browser.mjs; do
            echo "::group::$t"
            if ! timeout 300s node "$t"; then browser_failures=$((browser_failures + 1)); fi
            echo "::endgroup::"
          done
          test "$browser_failures" -eq 0
