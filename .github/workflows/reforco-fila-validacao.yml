name: Validar fila diária de reforço

on:
  push:
    branches:
      - fix/reforco-fila-diaria
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reforco-fila-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reforco-fila-diaria
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxe da fila
        run: node --check src/js/54-reforco-fila.js

      - name: Invariantes da fila
        run: node testes/reforco-fila.mjs

      - name: Montar app publicado
        run: node build.mjs

      - name: Barreira geral do projeto
        run: node verificar.mjs

      - name: Publicar artefatos gerados na branch
        run: |
          if git diff --quiet -- index.html src/manifesto.json sw.js; then
            echo "Artefatos já estavam atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/manifesto.json sw.js
          git commit -m "build: publica fila diária de reforço [skip ci]"
          git push origin HEAD:fix/reforco-fila-diaria
