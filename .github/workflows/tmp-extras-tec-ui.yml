name: Validar central de Extras e TEC v2
on:
  push:
    branches:
      - feat/extras-settings-tec-ui
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrar módulos ao montador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.mjs')
          s=p.read_text()
          old="""  SEP('\\n</style>\\n\\n<style id=\"tec-premium-v1\">\\n'), S('css/12-tec-premium.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
          new="""  SEP('\\n</style>\\n\\n<style id=\"tec-premium-v1\">\\n'), S('css/12-tec-premium.css'),\n  SEP('\\n</style>\\n\\n<style id=\"extras-central-v1\">\\n'), S('css/13-extras-central.css'),\n  SEP('\\n</style>\\n\\n<style id=\"tec-layout-v2\">\\n'), S('css/14-tec-layout-v2.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
          if old not in s:
              raise SystemExit('âncora CSS do build não encontrada')
          s=s.replace(old,new,1)
          oldjs="""    'js/58-extras-governanca.js',\n    'js/59-tec-premium.js',\n    'js/60-cloud-store.js',"""
          newjs="""    'js/58-extras-governanca.js',\n    'js/59-tec-premium.js',\n    'js/59-extras-central-ui.js',\n    'js/59-tec-layout-v2.js',\n    'js/60-cloud-store.js',"""
          if oldjs not in s:
              raise SystemExit('âncora JS do build não encontrada')
          p.write_text(s.replace(oldjs,newjs,1))
          PY
      - name: Validar sintaxe e contratos de UI
        run: |
          node --check src/js/59-extras-central-ui.js
          node --check src/js/59-tec-layout-v2.js
          node testes/ui-organizacao-extras-tec.mjs
          node testes/governanca-premium.mjs
          node testes/governanca-rebalanceamento.mjs
          node testes/lei-rodizio-perf.mjs
      - name: Reconstruir artefatos
        run: node build.mjs
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Suíte canônica completa
        run: node verificar.mjs
      - name: Persistir somente após tudo verde
        run: |
          rm -f .github/workflows/tmp-extras-tec-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.mjs index.html src/manifesto.json sw.js .github/workflows/tmp-extras-tec-ui.yml
          git commit -m "feat: organiza Extras e moderniza leitura do TEC"
          git push
