name: Ajuste isolado ciclo realista
on:
  push:
    branches: [fix/plano-ciclos-rotacao-real]
    paths: ['.github/workflows/fix-cycle-final.yml']
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plano-ciclos-rotacao-real
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correção estreita
        run: python3 scripts/fix-cycle-final.py
      - name: Instalar dependências
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gerar bundle
        run: node build.mjs
      - name: Verificar sem disparar e-mail de falha intermediária
        id: verify
        shell: bash
        run: |
          set +e
          node verificar.mjs > /tmp/verificar.log 2>&1
          code=$?
          cat /tmp/verificar.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commitar somente se tudo passou
        if: steps.verify.outputs.code == '0'
        run: |
          git config user.name 'StudyNoMentor'
          git config user.email 'jairo258@hotmail.com'
          git add src/js/51a-tec-scope-consistency.js src/js/51-tela-desempenho-tec.js testes/atividades-extras.mjs index.html src/manifesto.json sw.js
          git commit -m 'Separa sessão, ciclo e custo sem reescrever ciclos existentes'
          git push origin HEAD:fix/plano-ciclos-rotacao-real
      - name: Registrar falha sem mutar a branch
        if: steps.verify.outputs.code != '0'
        run: echo 'A validação encontrou regressões; nenhum arquivo de produto foi commitado.'
