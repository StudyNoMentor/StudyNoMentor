name: Auditar interacoes Extras e TEC
on:
  push:
    branches:
      - fix/extras-tec-interactions-audit
permissions:
  contents: write
jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correcoes auditadas
        run: python3 .github/patch-interacoes-audit.py
      - name: Sintaxe e build
        run: |
          node --check src/js/47-tela-extras.js
          node --check src/js/51-tela-desempenho-tec.js
          node --check src/js/59-interaction-feedback.js
          node --check testes/extras-tec-interacoes-browser.mjs
          node build.mjs
          node build.mjs --check
      - name: Dependencias
        run: npm ci
      - name: Regressao rapida
        run: |
          node testes/extras-estabilidade.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Auditoria real de interacoes
        run: |
          node testes/extras-tec-interacoes-browser.mjs
          node testes/tec-plano-performance-browser.mjs
          node testes/extras-estabilidade-browser.mjs
      - name: Suite canonica
        run: node verificar.mjs
      - name: Persistir produto aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/tmp-audit-interacoes.yml .github/patch-interacoes-audit.py
          git add build.mjs index.html src/manifesto.json sw.js src/css/17-interaction-feedback.css src/js/47-tela-extras.js src/js/51-tela-desempenho-tec.js src/js/59-interaction-feedback.js testes/extras-tec-interacoes-browser.mjs .github/workflows/verificar.yml .github/workflows/tmp-audit-interacoes.yml .github/patch-interacoes-audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: estabiliza interacoes de Extras e Desempenho TEC'
          git push origin HEAD:fix/extras-tec-interactions-audit
