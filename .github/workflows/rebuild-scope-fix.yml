name: Rebuild scope fix bundle

on:
  push:
    branches: [fix/tec-scope-plano-completo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tec-scope-plano-completo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerar artefatos derivados
        run: node build.mjs
      - name: Commitar bundle gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/manifesto.json sw.js
          if git diff --cached --quiet; then
            echo "Nada para regenerar"
            exit 0
          fi
          git commit -m "Regenera bundle do escopo TEC [skip ci]"
          git push origin HEAD:fix/tec-scope-plano-completo
