name: Refatoracao temporaria do reforco

on:
  push:
    branches: [fix/reforco-ux-contrato-diario]
    paths:
      - 'scripts/patch-reforco-ux.py'
      - '.github/workflows/tmp-reforco-ux-build.yml'
      - 'src/js/54-reforco-fila.js'
      - 'testes/reforco-fila.mjs'
      - 'verificar.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-reforco-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reforco-ux-contrato-diario
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar refatoracao
        run: python3 scripts/patch-reforco-ux.py
      - name: Reconstruir artefatos publicados
        run: node build.mjs
      - name: Validar regra de negocio do reforco
        run: node testes/reforco-fila.mjs
      - name: Validar integridade rapida do repositorio
        run: |
          npm ci
          node verificar.mjs --rapido
      - name: Persistir alteracoes validadas
        run: |
          git config user.name 'StudyNoMentor'
          git config user.email 'jairo258@hotmail.com'
          git add src/js/54-reforco-fila.js testes/reforco-fila.mjs verificar.mjs index.html src/manifesto.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: separa missao diaria e geral no reforco'
            git push origin HEAD:fix/reforco-ux-contrato-diario
          fi
