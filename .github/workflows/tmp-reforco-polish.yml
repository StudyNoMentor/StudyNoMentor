name: Validar polimento final do reforço

on:
  push:
    branches: [feat/reforco-config-robustez]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reforco-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar polimento
        run: python scripts/tmp-reforco-polish.py
      - name: Validar sintaxe e build
        run: |
          node --check src/js/54-reforco-fila.js
          node build.mjs
      - name: Testes focais
        run: |
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Dependências e Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Suíte canônica completa
        run: node verificar.mjs
      - name: Persistir somente se tudo verde
        run: |
          rm -f .github/workflows/tmp-reforco-polish.yml scripts/tmp-reforco-polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/54-reforco-fila.js index.html src/manifesto.json sw.js .github/workflows/tmp-reforco-polish.yml scripts/tmp-reforco-polish.py
          if git diff --cached --quiet; then
            echo "Nada a persistir"
          else
            git commit -m "fix: torna sugestões idempotentes e respeita carga na migração"
            git push origin HEAD:feat/reforco-config-robustez
          fi
