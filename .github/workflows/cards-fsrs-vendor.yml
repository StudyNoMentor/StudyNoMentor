name: Cards FSRS 6.6.2 vendor

# Só manual: a branch fixa de onde isto rodava (fix/cards-anki-perfect-parity-
# 20260923) já foi incorporada. Rode a partir da branch que precisa do vendor.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Prepare fsrs-rs 6.6.2 (crates.io, SHA-256 fixado) + patch wasm sequencial
        working-directory: tools/cards-fsrs-wasm
        run: ./preparar-fsrs.sh

      - name: Build exact fsrs-rs 6.6.2 wrapper
        working-directory: tools/cards-fsrs-wasm
        run: cargo build --release

      - name: Generate browser module
        run: |
          set -euxo pipefail
          rm -rf src/vendor/fsrs-6.6.2
          mkdir -p src/vendor/fsrs-6.6.2
          wasm-bindgen \
            tools/cards-fsrs-wasm/target/wasm32-unknown-unknown/release/study_cards_fsrs_wasm.wasm \
            --target web \
            --no-typescript \
            --out-dir src/vendor/fsrs-6.6.2 \
            --out-name fsrs_optimizer
          sha256sum src/vendor/fsrs-6.6.2/fsrs_optimizer_bg.wasm | awk '{print $1}' > src/vendor/fsrs-6.6.2/SHA256
          printf '%s\n' '{"fsrs_rs":"6.6.2","wasm_bindgen":"0.2.100","anki_reference":"26.09.2","training_epochs":8,"short_term":true,"simulator":"fsrs::simulate"}' > src/vendor/fsrs-6.6.2/version.json

      - name: Commit reproducible vendor assets
        run: |
          set -euxo pipefail
          git add src/vendor/fsrs-6.6.2
          if git diff --cached --quiet; then
            echo 'Vendor already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(cards): vendor fsrs-rs 6.6.2 wasm'
          # O build leva alguns segundos; a branch pode avançar enquanto isso.
          # Rebase preserva as alterações intermediárias e evita push rejeitado.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
