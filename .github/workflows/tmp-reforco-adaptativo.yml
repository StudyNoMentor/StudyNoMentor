name: Validar reforco adaptativo
on:
  push:
    branches: [feat/reforco-adaptativo-estatistico]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materializar motor e simulacao
        env:
          MOD: 
          TEST: 
        run: |
          mkdir -p src/js testes
          printf '%s' "$MOD" | base64 -d | gzip -d > src/js/59-reforco-adaptativo.js
          printf '%s' "$TEST" | base64 -d | gzip -d > testes/reforco-adaptativo-massivo.mjs
      - name: Integrar ao montador e gate permanente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.mjs'); s=p.read_text()
          old="""  SEP('\\n</style>\\n\\n<style id=\"tec-layout-v2\">\\n'), S('css/14-tec-layout-v2.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
          new="""  SEP('\\n</style>\\n\\n<style id=\"tec-layout-v2\">\\n'), S('css/14-tec-layout-v2.css'),\n  SEP('\\n</style>\\n\\n<style id=\"reforco-adaptativo-v1\">\\n'), S('css/15-reforco-adaptativo.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
          if old not in s: raise SystemExit('ancora CSS nao encontrada')
          s=s.replace(old,new,1)
          old="""    'js/59-extras-central-ui.js',\n    'js/59-tec-layout-v2.js',"""
          new="""    'js/59-extras-central-ui.js',\n    'js/59-reforco-adaptativo.js',\n    'js/59-tec-layout-v2.js',"""
          if old not in s: raise SystemExit('ancora JS nao encontrada')
          p.write_text(s.replace(old,new,1))

          q=Path('.github/workflows/verificar.yml'); v=q.read_text()
          marker="""      - name: Instalar Chromium\n"""
          add="""      - name: Simular prescricao adaptativa\n        run: node testes/reforco-adaptativo-massivo.mjs\n\n      - name: Instalar Chromium\n"""
          if 'Simular prescricao adaptativa' not in v:
              if marker not in v: raise SystemExit('ancora do workflow oficial nao encontrada')
              q.write_text(v.replace(marker,add,1))
          PY
      - name: Validar motor e simulacao massiva
        run: |
          node --check src/js/59-reforco-adaptativo.js
          node testes/reforco-adaptativo-massivo.mjs
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir somente apos tudo verde
        run: |
          rm -f .github/workflows/tmp-reforco-adaptativo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/js/59-reforco-adaptativo.js src/css/15-reforco-adaptativo.css testes/reforco-adaptativo-massivo.mjs build.mjs index.html src/manifesto.json sw.js .github/workflows/verificar.yml .github/workflows/tmp-reforco-adaptativo.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: implementa prescricao adaptativa do reforco'
          git push origin HEAD:feat/reforco-adaptativo-estatistico
