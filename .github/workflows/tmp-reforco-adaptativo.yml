name: Validar reforco adaptativo
on:
  push:
    branches: [feat/reforco-adaptativo-estatistico]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Ajustar opt-in e integrar ao montador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          js=Path('src/js/59-reforco-adaptativo.js'); t=js.read_text()
          start=t.find("      if(typeof PlanoCiclo.avaliar==='function'")
          end=t.find("    },\n    casa(o,x)", start)
          if start >= 0 and end > start:
              t=t[:start]+t[end:]
          t=t.replace("ativo:true,fase:'auto'", "ativo:false,fase:'auto'", 1)
          t=t.replace("catch(_){}", "catch(_){if(typeof _quiet==='function')_quiet(_,'reforco-adaptativo');}")
          js.write_text(t)

          tf=Path('testes/reforco-adaptativo-massivo.mjs'); u=tf.read_text()
          anchor="const rPre={meta:85,modoEdital:'pre',itens:[]},rPos={meta:85,modoEdital:'pos',itens:[]};"
          if "opt-in deve nascer desligado" not in u:
              repl="assert.equal(RA.prefs().ativo,false,'opt-in deve nascer desligado');\nmem.set('t:reforco-adaptativo-prefs',JSON.stringify({ativo:true}));\n"+anchor
              if anchor not in u: raise SystemExit('ancora teste opt-in nao encontrada')
              u=u.replace(anchor,repl,1)
          tf.write_text(u)

          p=Path('build.mjs'); s=p.read_text()
          if 'reforco-adaptativo-v1' not in s:
            old="""  SEP('\\n</style>\\n\\n<style id=\"tec-layout-v2\">\\n'), S('css/14-tec-layout-v2.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
            new="""  SEP('\\n</style>\\n\\n<style id=\"tec-layout-v2\">\\n'), S('css/14-tec-layout-v2.css'),\n  SEP('\\n</style>\\n\\n<style id=\"reforco-adaptativo-v1\">\\n'), S('css/15-reforco-adaptativo.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),"""
            if old not in s: raise SystemExit('ancora CSS nao encontrada')
            s=s.replace(old,new,1)
          if "'js/59-reforco-adaptativo.js'" not in s:
            old="""    'js/59-extras-central-ui.js',\n    'js/59-tec-layout-v2.js',"""
            new="""    'js/59-extras-central-ui.js',\n    'js/59-reforco-adaptativo.js',\n    'js/59-tec-layout-v2.js',"""
            if old not in s: raise SystemExit('ancora JS nao encontrada')
            s=s.replace(old,new,1)
          p.write_text(s)

          q=Path('.github/workflows/verificar.yml'); v=q.read_text()
          if 'Simular prescricao adaptativa' not in v:
            marker="      - name: Instalar Chromium\n"
            add="      - name: Simular prescricao adaptativa\n        run: node testes/reforco-adaptativo-massivo.mjs\n\n      - name: Instalar Chromium\n"
            if marker not in v: raise SystemExit('ancora gate nao encontrada')
            q.write_text(v.replace(marker,add,1))
          PY
      - name: Validar motor e simulacao massiva
        run: |
          node --check src/js/59-reforco-adaptativo.js
          node testes/reforco-adaptativo-massivo.mjs
          node build.mjs
          node build.mjs --check
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir somente apos tudo verde
        run: |
          rm -f .github/workflows/tmp-reforco-adaptativo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integra prescricao adaptativa do reforco'
          git push origin HEAD:feat/reforco-adaptativo-estatistico
