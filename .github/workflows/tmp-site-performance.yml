name: Auditoria performance site inteiro
on:
  push:
    branches:
      - perf/auditoria-site-inteiro
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar otimizações candidatas
        run: python3 .github/patch-performance-global.py
      - name: Sintaxe e build
        run: |
          node --check src/js/47-tela-extras.js
          node --check src/js/55-extras-ui-moderna.js
          node build.mjs
          node build.mjs --check
      - name: Dependencias
        run: npm ci
      - name: Regressão estrutural de Extras
        run: |
          node testes/extras-estabilidade.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Medir todas as telas
        run: node testes/site-performance-browser.mjs
      - name: Validar Extras real
        run: node testes/extras-estabilidade-browser.mjs
