name: Auditoria performance site inteiro
on:
  push:
    branches:
      - perf/auditoria-site-inteiro
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: npm ci
      - name: Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Medir todas as telas
        run: node testes/site-performance-browser.mjs
