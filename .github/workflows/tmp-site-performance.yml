name: Auditoria performance site inteiro
on:
  push:
    branches:
      - perf/auditoria-site-inteiro
permissions:
  contents: write
jobs:
  auditar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar otimizações candidatas
        run: |
          python3 .github/patch-performance-global.py
          python3 .github/patch-performance-tec-cache.py
          python3 .github/patch-performance-extras-page.py
      - name: Sintaxe e build
        run: |
          node --check src/js/11-db.js
          node --check src/js/47-tela-extras.js
          node --check src/js/51-tela-desempenho-tec.js
          node --check src/js/55-extras-ui-moderna.js
          node --check testes/site-performance-browser.mjs
          node build.mjs
          node build.mjs --check
      - name: Dependencias
        run: npm ci
      - name: Regressão estrutural
        run: |
          node testes/extras-estabilidade.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Medir todas as telas e CPU móvel
        run: node testes/site-performance-browser.mjs
      - name: Validar Extras real
        run: node testes/extras-estabilidade-browser.mjs
      - name: Validar interações Extras e TEC
        run: node testes/extras-tec-interacoes-browser.mjs
      - name: Validar Plano TEC grande
        run: node testes/tec-plano-performance-browser.mjs
      - name: Suíte canônica completa
        run: node verificar.mjs
      - name: Persistir produto aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/manifesto.json sw.js src/css/09-extras-v51.css src/js/11-db.js src/js/47-tela-extras.js src/js/51-tela-desempenho-tec.js src/js/55-extras-ui-moderna.js testes/site-performance-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'perf: reduz latência de Extras e Desempenho TEC'
          git push origin HEAD:perf/auditoria-site-inteiro
