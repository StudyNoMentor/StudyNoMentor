name: Ajuste temporario barra global reforco

on:
  push:
    branches: [fix/reforco-ux-contrato-diario]
    paths:
      - 'scripts/tmp-fix-reforco-card-global.py'
      - '.github/workflows/tmp-fix-reforco-card-global.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-card-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aplicar-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reforco-ux-contrato-diario
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar ajuste
        run: python3 scripts/tmp-fix-reforco-card-global.py
      - name: Reconstruir artefatos
        run: node build.mjs
      - name: Validar fila
        run: node testes/reforco-fila.mjs
      - name: Validar integridade rapida
        run: |
          npm ci
          node verificar.mjs --rapido
      - name: Persistir ajuste validado
        run: |
          git config user.name 'StudyNoMentor'
          git config user.email 'jairo258@hotmail.com'
          git add src/js/54-reforco-fila.js index.html src/manifesto.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserva progresso global no card de reforco'
            git push origin HEAD:fix/reforco-ux-contrato-diario
          fi
