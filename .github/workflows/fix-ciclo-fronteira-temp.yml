name: Fix fronteira ciclo temporario
on:
  push:
    branches: [fix/plano-ciclos-rotacao-real]
    paths: [.github/workflows/fix-ciclo-fronteira-temp.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plano-ciclos-rotacao-real
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar fronteira estrita de criação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/js/51a-tec-scope-consistency.js')
          s=p.read_text()
          # Remove a interceptação global de DB.updateExtra e a migração em avaliar.
          pat=r"\n  /\* Os dois portões criam a atividade.*?\n  if \(EX\) \{"
          s,n=re.subn(pat,"\n  if (EX) {",s,count=1,flags=re.S)
          assert n==1, 'bloco global de updateExtra não encontrado'
          # Migração só quando a própria tela operacional é aberta e somente para alvo legado realmente anômalo e zerado.
          marker="""    const depoisDeRender = () => {\n      try {"""
          ins="""    const depoisDeRender = () => {\n      try {\n        /* Migração de legado fica na superfície operacional, não no banco global.\n           Só reduz alvos antigos >120 que ainda não começaram. */\n        if (typeof DB.getExtras === 'function' && typeof DB.updateExtra === 'function') {\n          (DB.getExtras() || []).forEach(e => {\n            const o = e && e.origemPlano;\n            if (!o || o.modeloExecucao || e.status === 'concluida' || Number(e.alvo) <= MAX_CICLO * 4) return;\n            let feito = Number(e.progresso) || 0;\n            try { if (typeof DB.extraProgressoPeriodo === 'function') feito = Math.max(feito, Number(DB.extraProgressoPeriodo(e)) || 0); } catch (_) {}\n            if (feito > 0) return;\n            const ex = execucao({ taxa: o.taxaInicial, qJanela: 0, custoQ: Number(e.alvo) || 0 }, o.motivo || 'reforco');\n            DB.updateExtra(e.id, { alvo: ex.ciclo, origemPlano: Object.assign({}, o, {\n              modeloExecucao: 2, custoEstimadoQ: Number(e.alvo) || null, metaCicloQ: ex.ciclo,\n              metaSessaoQ: ex.sessao, qMedirAlvo: ex.qMedirAlvo, migradoDeAlvo: Number(e.alvo) || null\n            }) });\n          });\n        }"""
          assert marker in s
          s=s.replace(marker,ins,1)
          p.write_text(s)

          # O botão +Atividade do Plano usa a meta curta SOMENTE quando o item renderizado recebeu metadata v2.
          q=Path('src/js/51-tela-desempenho-tec.js')
          t=q.read_text()
          old="alvo: Math.max(1, parseInt(alvo, 10) || 30),"
          new="alvo: (alvoTop && alvoTop.metaCicloQ) ? Math.max(1, parseInt(alvoTop.metaCicloQ, 10)) : Math.max(1, parseInt(alvo, 10) || 30),"
          assert t.count(old)==1, f'alvo de criação esperado 1x, veio {t.count(old)}'
          t=t.replace(old,new,1)
          q.write_text(t)

          # Atualiza a proteção estática para a nova fronteira, sem interceptador global.
          z=Path('testes/atividades-extras.mjs')
          u=z.read_text()
          u=u.replace("a(scope.includes('(v.feito || 0) === 0'),'migração de alvo legado não é conservadora');", "a(scope.includes('Number(e.alvo) <= MAX_CICLO * 4'),'migração de alvo legado não limita anomalias');a(scope.includes('if (feito > 0) return'),'migração de alvo legado não preserva ciclo iniciado');a(scope.includes('alvoTop && alvoTop.metaCicloQ'),'criação direta do Plano não usa meta operacional');")
          z.write_text(u)
          PY
          node --check src/js/51a-tec-scope-consistency.js
          node --check src/js/51-tela-desempenho-tec.js
          node testes/atividades-extras.mjs
          node build.mjs
          node build.mjs --check
      - name: Gravar ajuste
        run: |
          git config user.name StudyNoMentor
          git config user.email jairo258@hotmail.com
          git add src/js/51a-tec-scope-consistency.js src/js/51-tela-desempenho-tec.js testes/atividades-extras.mjs index.html src/manifesto.json sw.js
          git commit -m "Aplica ciclos curtos só nas criações operacionais"
          git push origin HEAD:fix/plano-ciclos-rotacao-real
