name: Rebuild generated app

on:
  push:
    paths:
      - 'src/**'
      - 'build.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild generated files
        run: node build.mjs
      - name: Commit generated files when needed
        shell: bash
        run: |
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            echo "Generated files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: sync generated app"
          git push origin "HEAD:${GITHUB_REF_NAME}"
