name: Validar fluidez Extras e Plano
on:
  push:
    branches:
      - fix/extras-tec-latencia-reabertura
permissions:
  contents: write
jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar hardening de interação
        run: |
          python3 .github/patch-fluidez.py
          python3 .github/patch-selo-plano.py
          python3 .github/patch-diagnostico-veredito.py
      - name: Sintaxe e build
        run: |
          node --check src/js/11-db.js
          node --check src/js/47-tela-extras.js
          node --check src/js/51-tela-desempenho-tec.js
          node --check src/js/59-interaction-feedback.js
          node --check testes/extras-tec-interacoes-browser.mjs
          node build.mjs
          node build.mjs --check
      - name: Dependências
        run: npm ci
      - name: Regressões rápidas
        run: |
          node testes/extras-estabilidade.mjs
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validar interação real
        run: |
          node testes/extras-tec-interacoes-browser.mjs
          node testes/tec-plano-performance-browser.mjs
          node testes/extras-estabilidade-browser.mjs
      - name: Suíte canônica
        run: node verificar.mjs
      - name: Persistir produto aprovado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- testes/extras-tec-interacoes-browser.mjs
          rm -f .github/workflows/tmp-inspecao-extras-tec.yml .github/patch-fluidez.py .github/patch-selo-plano.py .github/patch-diagnostico-veredito.py
          git add build.mjs src/js/11-db.js src/js/47-tela-extras.js src/js/51-tela-desempenho-tec.js src/js/59-interaction-feedback.js src/css/17-interaction-feedback.css testes/extras-tec-interacoes-browser.mjs index.html src/manifesto.json sw.js .github/workflows/tmp-inspecao-extras-tec.yml .github/patch-fluidez.py .github/patch-selo-plano.py .github/patch-diagnostico-veredito.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: melhora fluidez e reabertura em Extras e Plano'
          git push origin HEAD:fix/extras-tec-latencia-reabertura
