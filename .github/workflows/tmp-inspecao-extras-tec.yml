          node --check src/js/59-interaction-feedback.js
          node --check testes/extras-tec-interacoes-browser.mjs
          node build.mjs
          node build.mjs --check
      - name: Dependencias
        run: npm ci
      - name: Regressões rápidas
        run: |
          node testes/extras-estabilidade.mjs
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs
