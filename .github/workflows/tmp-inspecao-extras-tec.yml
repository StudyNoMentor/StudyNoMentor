name: Validar fluidez Extras e Plano
on:
  push:
    branches: [fix/extras-tec-latencia-reabertura]
permissions:
  contents: write
jobs:
  validar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Aplicar hardening de interação
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, nome):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{nome}: esperava 1 ocorrência, achei {n}')
              return s.replace(old,new,1)

          # build: monta o novo CSS/JS no artefato publicado.
          p=Path('build.mjs'); s=p.read_text()
          s=once(s,
            "  SEP('\\n</style>\\n\\n<style id=\"extras-stability-v1\">\\n'), S('css/16-extras-stability.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),",
            "  SEP('\\n</style>\\n\\n<style id=\"extras-stability-v1\">\\n'), S('css/16-extras-stability.css'),\n  SEP('\\n</style>\\n\\n<style id=\"interaction-feedback-v1\">\\n'), S('css/17-interaction-feedback.css'),\n  SEP('\\n</style>\\n\\n<script id=\"app-code\" type=\"application/x-diario-inert\">\\n'),",
            'build css')
          s=once(s,
            "    'js/59-extras-stability.js',\n    'js/60-cloud-store.js',",
            "    'js/59-extras-stability.js',\n    'js/59-interaction-feedback.js',\n    'js/60-cloud-store.js',",
            'build js')
          p.write_text(s)

          # Extras: o clique pinta feedback antes de entrar no cálculo.
          p=Path('src/js/47-tela-extras.js'); s=p.read_text()
          s=once(s,
            "  on('extras-plano-btn', 'click', () => ExtrasScreen.puxarDoPlano());",
            "  on('extras-plano-btn', 'click', (ev) => {\n    const run = window.WorkFeedback && WorkFeedback.run;\n    if (run) WorkFeedback.run(ev.currentTarget, 'Analisando Plano…', () => ExtrasScreen.puxarDoPlano(), { overlay: true, region: '#screen-extras', context: 'extras-puxar-plano' });\n    else ExtrasScreen.puxarDoPlano();\n  });",
            'extras botão plano')
          s=once(s,
            "    if (ord) ord.addEventListener('change', () => {\n      this._planoOrd = ord.value;\n      this._planoRecalc();\n      // mantém as marcações por NOME do assunto ao reordenar\n      const marcadosNomes = new Set([...this._planoSel].map(i => (cand[i] || {}).nome).filter(Boolean));\n      this._planoSel = new Set();\n      (this._planoCand || []).forEach((x, i) => { if (marcadosNomes.has(x.nome)) this._planoSel.add(i); });\n      // atualiza o dropdown de disciplinas (a contagem pode mudar) e a lista\n      this._planoBind();\n      this._planoRenderLista();\n    });",
            "    if (ord) ord.addEventListener('change', () => {\n      const executar = () => {\n        this._planoOrd = ord.value;\n        this._planoRecalc();\n        // mantém as marcações por NOME do assunto ao reordenar\n        const marcadosNomes = new Set([...this._planoSel].map(i => (cand[i] || {}).nome).filter(Boolean));\n        this._planoSel = new Set();\n        (this._planoCand || []).forEach((x, i) => { if (marcadosNomes.has(x.nome)) this._planoSel.add(i); });\n        // atualiza o dropdown de disciplinas (a contagem pode mudar) e a lista\n        this._planoBind();\n        this._planoRenderLista();\n      };\n      if (window.WorkFeedback) WorkFeedback.run(null, 'Reordenando sugestões…', executar, { overlay: true, region: '#ui-modal', context: 'extras-plano-ordem' });\n      else executar();\n    });",
            'extras ordem plano')
          old="""    }).then((ok) => {
      if (!ok) return;
      let n = 0;
      (this._planoCand || []).forEach((x, i) => {
        if (!this._planoSel || !this._planoSel.has(i)) return;
        const e = DB.addExtra({
          // o mesmo título dos dois portões (ver `PlanoCiclo.titulo`)
          titulo: PlanoCiclo.titulo(x.nome, x.motivo, x.membros),
          tipo: 'questoes', disciplina: x.disciplina || '', unidade: 'questoes',
          alvo: Math.max(1, x.alvo), periodo: 'unica', contaMetricas: false,
          obs: 'Gerado pelo Plano de pontos fracos.'
        });
        // mesma origem do outro portão: sem isto a atividade nascia sem
        // `taxaInicial` nem `qBase`, e o ciclo dela nunca teria veredito
        if (e) { DB.updateExtra(e.id, { origemPlano: PlanoCiclo.origem(x.nome, x.disciplina, x, { motivo: x.motivo }) }); n++; }
      });
      this.render();
      showToast(n ? n + ' atividade(s) criada(s) ✓' : 'Nenhuma selecionada');
    });"""
