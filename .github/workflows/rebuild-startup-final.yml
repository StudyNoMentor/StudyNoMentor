name: Rebuild startup final

on:
  push:
    branches:
      - fix/startup-auth-persistence-hardening-v1

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-auth-persistence-hardening-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated application
        run: node build.mjs
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            echo "Generated files already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js src/manifesto.json
          git commit -m "build: synchronize final startup artifacts"
          git push origin HEAD:fix/startup-auth-persistence-hardening-v1
