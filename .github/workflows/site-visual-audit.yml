name: Site Visual Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Diagnosticar overflow em todas as telas
        run: node testes/site-overflow-diagnostico.mjs
      - name: Auditar CSS, HTML, JS e todas as telas
        run: node testes/site-visual-auditoria-total.mjs
