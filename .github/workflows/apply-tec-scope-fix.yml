name: Apply TEC scope fix

on:
  push:
    branches:
      - 'fix/tec-scope-plano'

permissions:
  contents: write

concurrency:
  group: apply-tec-scope-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tec-scope-plano
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar correção, gerar artefatos e validar
        run: node .github/apply-tec-scope-fix.mjs
      - name: Commitar arquivos gerados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.mjs verificar.mjs index.html src/manifesto.json sw.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração adicional.'
            exit 0
          fi
          git commit -m 'fix(tec): propagate analysis scope through Plano'
          git push origin HEAD:fix/tec-scope-plano
