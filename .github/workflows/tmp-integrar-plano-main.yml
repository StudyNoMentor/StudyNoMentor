name: Integrar Plano na main

on:
  push:
    branches: [fix/plano-estabilizacao-main]

permissions:
  contents: write

concurrency:
  group: integrar-plano-main
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plano-estabilizacao-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruir artefatos publicados
        run: node build.mjs
      - name: Instalar dependencias
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Suite canonica completa
        run: node verificar.mjs
      - name: Persistir somente apos suite verde
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-integrar-plano-main.yml
          git add index.html src/manifesto.json sw.js
          git commit -m "build: publica estabilizacao validada do Plano"
          git push origin HEAD:fix/plano-estabilizacao-main
