name: TEMP Sync TEC Import
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar e publicar artefatos derivados
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          if git diff --quiet -- index.html sw.js src/manifesto.json; then
            echo 'Artefatos já sincronizados.'
            exit 0
          fi
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js src/manifesto.json
          git commit -m 'build: sincroniza gestão completa de importações TEC'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
