name: Validar governança premium de Extras e TEC
on:
  push:
    branches:
      - feat/lei-seca-rodizio-perf-extras
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrar novos módulos ao montador
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('build.mjs')
          s=p.read_text()
          css="  SEP('\\n</style>\\n\\n<style id=\"lei-rodizio-v1\">\\n'), S('css/10-lei-rodizio.css'),\n"
          css2=css+"  SEP('\\n</style>\\n\\n<style id=\"extras-governanca-v1\">\\n'), S('css/11-extras-governanca.css'),\n  SEP('\\n</style>\\n\\n<style id=\"tec-premium-v1\">\\n'), S('css/12-tec-premium.css'),\n"
          if "css/11-extras-governanca.css" not in s:
              if css not in s: raise SystemExit('âncora CSS não encontrada')
              s=s.replace(css,css2,1)
          js="    'js/57-extras-lei-fonte.js',\n"
          js2=js+"    'js/58-extras-governanca.js',\n    'js/59-tec-premium.js',\n"
          if "js/58-extras-governanca.js" not in s:
              if js not in s: raise SystemExit('âncora JS não encontrada')
              s=s.replace(js,js2,1)
          p.write_text(s)
          PY
      - name: Validar sintaxe e contratos novos
        run: |
          node --check src/js/58-extras-governanca.js
          node --check src/js/59-tec-premium.js
          node testes/governanca-premium.mjs
          node testes/lei-rodizio-perf.mjs
          node testes/reforco-fila.mjs
          node testes/reforco-cenarios.mjs
      - name: Reconstruir artefatos
        run: |
          node build.mjs
          node build.mjs --check
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Suíte canônica completa
        run: node verificar.mjs
      - name: Persistir somente após tudo verde
        run: |
          rm -f .github/workflows/tmp-governanca-premium.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: governa reforços, lei seca e otimiza Desempenho TEC"
          git push
