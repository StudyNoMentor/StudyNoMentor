name: Ajuste final KPI Ciclo V2

on:
  push:
    branches: [refactor/ux-hierarquia-visual-v2]

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ux-hierarquia-visual-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixar diferenca fisica entre KPIs principais e derivados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/css/27-ux-hierarquia.css')
          s=p.read_text()
          marker='/* UX V2 final: presença física distinta dos KPIs do Ciclo, sem herdar altura uniforme. */\n'
          rule='''#ciclo-overview-gauges.ux-week-gauges{align-items:start!important;grid-auto-rows:auto!important}\n#ciclo-overview-gauges.ux-week-gauges .mini-gauge-card{align-self:start!important;height:auto!important}\n#ciclo-overview-gauges.ux-week-gauges .mini-gauge-card[data-ux-priority="primary"]{min-height:116px!important;padding:20px 16px!important}\n#ciclo-overview-gauges.ux-week-gauges .mini-gauge-card[data-ux-priority="secondary"],#ciclo-overview-gauges.ux-week-gauges .mini-gauge-card[data-ux-priority="tertiary"]{min-height:0!important;padding:10px 12px!important}\n'''
          if marker not in s:
              s += '\n'+marker+rule
          p.write_text(s)
          PY
          rm .github/workflows/tmp-kpi-ciclo-v2.yml
          node build.mjs
          node testes/repositorio-higiene.mjs
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/css/27-ux-hierarquia.css .github/workflows/tmp-kpi-ciclo-v2.yml index.html sw.js src/manifesto.json
          git commit -m 'fix: destaca fisicamente os KPIs principais do Ciclo'
          git push origin HEAD:refactor/ux-hierarquia-visual-v2
