name: Correcao UX Stability temporaria

on:
  push:
    branches: [chore/main-hygiene-audit-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/main-hygiene-audit-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Renomear API e validar estabilidade
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='src/js/81-ux-stability.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('  const UX = {','  const UXStability = {')
             .replaceAll('UX.decorateLawList()','UXStability.decorateLawList()')
             .replaceAll('UX.decorateCourse()','UXStability.decorateCourse()')
             .replace('  UX.init();\n  window.UX = UX;','  UXStability.init();\n  window.UXStability = UXStability;');
          fs.writeFileSync(p,s);

          const t='testes/ux-stability-browser.mjs';
          let q=fs.readFileSync(t,'utf8');
          q=q.replace('window.UX&&window.ExtrasModern','window.UXStability&&window.ExtrasModern')
             .replaceAll('UX.decorateLawList()','UXStability.decorateLawList()')
             .replaceAll('UX._tecFirstOpen','UXStability._tecFirstOpen')
             .replaceAll('UX._cloudUserAt','UXStability._cloudUserAt')
             .replace('UX STABILITY V3 OK','UX STABILITY OK');
          fs.writeFileSync(t,q);
          NODE
          node --check src/js/81-ux-stability.js
          node --check testes/ux-stability-browser.mjs
          node build.mjs
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node testes/ux-stability-browser.mjs
          node testes/repositorio-higiene.mjs
          git config user.name 'StudyNoMentor CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git commit -m 'refactor: isola API canonica de estabilidade UX'
          git push origin HEAD:chore/main-hygiene-audit-v1