name: Sync Anki Official production backend

on:
  push:
    branches: [main]
    paths:
      - 'anki_official_backend/**'
      - '.github/workflows/sync-anki-official-production.yml'
      - 'tools/sync-anki-production.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anki-official-production-sync
  cancel-in-progress: true

jobs:
  sync-deploy-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize validated main into Railway production source
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sync-anki-production.sh
      - name: Verify the deployed Anki revision
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time, urllib.request
          expected = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          url = 'https://anki-official-production.up.railway.app/health'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      health = json.load(response)
                  if (health.get('ok') is True and health.get('engine') == 'anki'
                          and health.get('runtime_version') == '26.09.3'
                          and health.get('source_main') == expected):
                      print('Anki official production verified:', json.dumps(health))
                      break
                  print('Waiting for production revision:', health.get('source_rev'), health.get('source_main'))
              except Exception as error:
                  print('Waiting for production health:', str(error))
              time.sleep(10)
          else:
              raise SystemExit('Railway did not publish the expected main revision. Redeploy from source; a green branch sync is not a successful deployment.')
          PY
