name: Sync Anki Official production backend

on:
  push:
    branches: [main]
    paths:
      - 'anki_official_backend/**'
      - '.github/workflows/sync-anki-official-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anki-official-production-sync
  cancel-in-progress: true

jobs:
  sync-deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main into Railway production source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main" || test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          git push --force origin HEAD:refs/heads/feat/anki-official-engine-20260923
          echo "Railway source branch synchronized to ${GITHUB_SHA}."
