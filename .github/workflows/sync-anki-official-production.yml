name: Sync Anki Official production backend

on:
  push:
    branches: [main]
    paths:
      - 'anki_official_backend/**'
      - 'anki-oficial/UPSTREAM.lock.json'
      - '.github/workflows/sync-anki-official-production.yml'
      - 'tools/sync-anki-production.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anki-official-production-sync
  cancel-in-progress: true

jobs:
  sync-deploy-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Railway deployment credentials
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Configure the repository Actions secret RAILWAY_TOKEN with a Railway account/workspace API token. Branch synchronization alone does not trigger a reliable deployment."
            exit 1
          fi
      - name: Synchronize validated main into Railway production source
        shell: bash
        run: |
          set -euo pipefail
          bash tools/sync-anki-production.sh
      - name: Deploy the latest configured Railway source
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_CALLER: skill:use-railway@1.3.5
          RAILWAY_AGENT_SESSION: github-actions-${{ github.run_id }}
        run: |
          set -euo pipefail
          # A regular redeploy rebuilds the previous commit. --from-source
          # explicitly fetches the branch synchronized in the preceding step.
          npx --yes @railway/cli@5.23.3 redeploy --from-source --yes --json \
            --project b397b7ee-53fe-4eb6-b04d-55233b005c6d \
            --environment c6de10ac-41e0-4a43-8606-0c98800e9b71 \
            --service c4a51e33-12b9-40b7-af5a-1ca38e2d17cf
      - name: Verify the deployed Anki revision
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, time, urllib.request
          expected = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          with open("anki-oficial/UPSTREAM.lock.json", encoding="utf-8") as fh:
              expected_version = json.load(fh)["release"]
          url = 'https://anki-official-production.up.railway.app/health'
          for attempt in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      health = json.load(response)
                  if (health.get('ok') is True and health.get('engine') == 'anki'
                          and health.get('runtime_version') == expected_version
                          and health.get('source_main') == expected):
                      print('Anki official production verified:', expected_version, json.dumps(health))
                      break
                  print('Waiting for production revision:', health.get('source_rev'), health.get('source_main'))
              except Exception as error:
                  print('Waiting for production health:', str(error))
              time.sleep(10)
          else:
              raise SystemExit('Railway did not publish the expected main revision. Redeploy from source; a green branch sync is not a successful deployment.')
          PY
