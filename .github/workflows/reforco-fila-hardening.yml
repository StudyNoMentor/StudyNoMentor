name: Hardening final da fila de reforço

on:
  push:
    branches:
      - fix/reforco-fila-diaria
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reforco-fila-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reforco-fila-diaria
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar hardening cirúrgico
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/js/54-reforco-fila.js')
          s = p.read_text(encoding='utf-8')
          trocas = [
            ('menor taxa inicial (assunto mais crítico);', 'menor taxa atual (assunto mais crítico);'),
            ('blocos balanceados com teto de 30 questões:', 'blocos balanceados com teto de 25 questões:'),
            ('  BLOCO_MAX: 30,', '  BLOCO_MAX: 25,'),
            ('''    const ver = e.origemPlano.veredito;\n    if (!ver.porMao) return false;\n    let v = null;\n    try { v = this.avaliarGlobal(e, ref); } catch (_) { _quiet(_); }\n    if (!v || !(v.feito < v.alvo) || v.bateu || v.mediu) return false;\n    const dia = ver.em || todayLocal();''', '''    const ver = e.origemPlano.veredito;\n    const dia = ver.em || '';\n    const teveParcialNoDia = (e.historico || []).some(h => h.data === dia && (parseFloat(h.quantidade) || 0) > 0);\n    // Só corrige automaticamente o padrão inequívoco do bug atual. Fechamentos\n    // históricos ou vereditos com medição/calibração permanecem intocados.\n    if (!ver.porMao || ver.tipo !== 'encerradaPorVoce' || dia !== todayLocal() || !teveParcialNoDia) return false;\n    let v = null;\n    try { v = this.avaliarGlobal(e, ref); } catch (_) { _quiet(_); }\n    if (!v || !(v.feito < v.alvo) || v.bateu || v.mediu) return false;'''),
            ('''          taxa: (e.origemPlano && e.origemPlano.taxaInicial != null) ? e.origemPlano.taxaInicial : 999,''', '''          taxa: (s.avaliacao && isFinite(parseFloat(s.avaliacao.taxa)))\n            ? parseFloat(s.avaliacao.taxa)\n            : ((e.origemPlano && e.origemPlano.taxaInicial != null) ? e.origemPlano.taxaInicial : 999),''')
          ]
          for antigo, novo in trocas:
            if antigo not in s:
              raise SystemExit('Trecho esperado não encontrado em 54-reforco-fila.js: ' + antigo[:80])
            s = s.replace(antigo, novo, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('testes/reforco-fila.mjs')
          x = t.read_text(encoding='utf-8')
          trocas_t = [
            ('''      extra: e, origem: e.origemPlano, alvo, feito, manual: feito, medido: 0,''', '''      extra: e, origem: e.origemPlano, alvo, feito, manual: feito, medido: 0,\n      taxa: e.taxaAtual ?? e.origemPlano?.taxaInicial ?? 999,'''),
            ('''  extra('A1', 'A', 100, 20),''', '''  extra('A1', 'A', 100, 30),'''),
            ('''  extra('A2', 'A', 33, 25)\n];''', '''  extra('A2', 'A', 33, 20)\n];\n// A1 nasceu menos crítico que A2, mas HOJE é mais crítico. O rodízio deve usar\n// a leitura atual quando ela existir, não congelar a prioridade da criação.\nDB.getExtra('A1').taxaAtual = 10;\nDB.getExtra('A2').taxaAtual = 15;'''),
            ('''legado.progresso = 10;\nlegado.status = 'concluida';''', '''legado.progresso = 10;\nlegado.historico = [{ data: HOJE, quantidade: 10 }];\nlegado.status = 'concluida';'''),
            ('''console.log('OK: fila diária do reforço preserva ciclo, rodízio e saldo.');''', '''// 6) Segurança da migração: um ciclo antigo encerrado manualmente não é reaberto.\nconst antigo = extra('OLD', 'F', 50, 18);\nantigo.progresso = 10;\nantigo.historico = [{ data: '2026-09-12', quantidade: 10 }];\nantigo.status = 'concluida';\nantigo.origemPlano.veredito = { tipo: 'encerradaPorVoce', em: '2026-09-12', porMao: true, questoes: 10, alvo: 50 };\nDB._data.push(antigo);\nF._assinaturaAnterior = '';\nF.sincronizar();\nassert.equal(antigo.status, 'concluida', 'migração não pode ressuscitar encerramentos históricos deliberados');\n\nconsole.log('OK: fila diária do reforço preserva ciclo, rodízio, criticidade e saldo.');''')
          ]
          for antigo, novo in trocas_t:
            if antigo not in x:
              raise SystemExit('Trecho esperado não encontrado em reforco-fila.mjs: ' + antigo[:80])
            x = x.replace(antigo, novo, 1)
          t.write_text(x, encoding='utf-8')
          PY

      - name: Validar sintaxe e invariantes
        run: |
          node --check src/js/54-reforco-fila.js
          node testes/reforco-fila.mjs

      - name: Montar e validar app completo
        run: |
          node build.mjs
          node verificar.mjs

      - name: Commitar hardening e artefatos publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/js/54-reforco-fila.js testes/reforco-fila.mjs index.html src/manifesto.json sw.js
          git commit -m "fix: endurece migração e prioridade do reforço [skip ci]"
          git push origin HEAD:fix/reforco-fila-diaria
