[package]
name = "study-cards-fsrs-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fsrs = "=6.6.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = "=0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.100"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
